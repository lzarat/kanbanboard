<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Tracker - Seguimiento de Actividades</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --bg-card: #1c2128;
    --bg-hover: #2d333b;
    --border: #30363d;
    --border-light: #484f58;
    --text-primary: #e6edf3;
    --text-secondary: #9aa4b2;
    --text-muted: #7b838b;

    /* Accent */
    --accent: #58a6ff;
    --accent-hover: #79b8ff;

    /* Status / urgencias (mejor contraste) */
    --urgent: #ff4d4f;
    --high: #ff9f43;
    --medium: #a78bfa;
    --low: #3fc07a;

    /* Fecha / hoy */
    --today: #60a5fa;

    /* Progress palette */
    --progress-0: #3b3f46;
    --progress-25: #ff8a65;
    --progress-50: #60a5fa;
    --progress-75: #a78bfa;
    --progress-100: #4ade80;
    --danger: #ff4d4f;
    --success: #3fc07a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Roboto Condensed', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* Header */
  .header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:100; }
  .header h1 { font-size:1.4rem; font-weight:600; }
  .header-actions { display:flex; gap:10px; align-items:center; }

  .btn { font-family:'Roboto Condensed',sans-serif; font-size:0.9rem; padding:8px 16px; border-radius:6px; border:1px solid var(--border); background:var(--bg-tertiary); color:var(--text-primary); cursor:pointer; }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#0d1117; }
  .btn-sm { padding:4px 10px; font-size:0.8rem; }

  /* Board */
  .board { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding:20px 24px; min-height:calc(100vh - 140px); }
  @media (max-width:900px){ .board { grid-template-columns:1fr; } }
  .column { background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; display:flex; flex-direction:column; max-height:calc(100vh - 160px); }
  .column-header { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .column-body { padding:12px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:10px; }

  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:14px; cursor:grab; position:relative; overflow:hidden; }
  .card:hover{ filter:brightness(1.05); border-color:var(--border-light); }

  .card-title{ font-size:0.95rem; font-weight:500; margin-bottom:8px; }
  .card-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tag { font-size:0.7rem; padding:2px 8px; border-radius:4px; }

  /* Modal */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; opacity:0; visibility:hidden; transition:all 0.2s; }
  .modal-overlay.open{ opacity:1; visibility:visible; }
  .modal{ background:var(--bg-secondary); border:1px solid var(--border); border-radius:10px; width:100%; max-width:520px; padding:24px; max-height:90vh; overflow-y:auto; }

  /* Palette swatch focus */
  .category-swatch:focus{ box-shadow:0 0 0 3px rgba(88,166,255,0.15); border-color:var(--accent); }

  ::-webkit-scrollbar{ width:6px; } ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<header class="header">
  <h1>◈ Seguimiento de Actividades</h1>
  <div class="header-actions">
    <div class="view-toggle">
      <button id="btnBoard" class="active" onclick="switchView('board')">Tablero</button>
      <button id="btnCalendar" onclick="switchView('calendar')">Calendario</button>
    </div>
    <button class="btn btn-primary" onclick="openModal()">+ Nueva actividad</button>
  </div>
</header>

<div class="filters" id="filters">
  <span class="filter-label">Filtrar por categoría:</span>
  <button class="tag-filter active" data-cat="all" onclick="filterByCategory('all')">Todas</button>
</div>

<div class="board" id="boardView">
  <div class="column" data-status="pending">
    <div class="column-header">
      <div class="column-title"><span>Pendientes</span><span class="column-count" id="count-pending">0</span></div>
    </div>
    <div class="column-body" id="col-pending" ondragover="allowDrop(event)" ondrop="drop(event, 'pending')"></div>
  </div>
  <div class="column" data-status="in-progress">
    <div class="column-header">
      <div class="column-title"><span>En progreso</span><span class="column-count" id="count-in-progress">0</span></div>
    </div>
    <div class="column-body" id="col-in-progress" ondragover="allowDrop(event)" ondrop="drop(event, 'in-progress')"></div>
  </div>
  <div class="column" data-status="completed">
    <div class="column-header">
      <div class="column-title"><span>Completadas</span><span class="column-count" id="count-completed">0</span></div>
      <button class="btn btn-sm btn-danger" onclick="clearCompleted()" title="Limpiar completadas">Limpiar</button>
    </div>
    <div class="column-body" id="col-completed" ondragover="allowDrop(event)" ondrop="drop(event, 'completed')"></div>
  </div>
</div>

<div class="calendar-view" id="calendarView" style="display:none; padding:20px 24px;">
  <div class="calendar-header">
    <h2 id="calMonthYear"></h2>
    <div class="calendar-nav">
      <button class="btn btn-sm" onclick="changeMonth(-1)">‹ Anterior</button>
      <button class="btn btn-sm" onclick="goToToday()">Hoy</button>
      <button class="btn btn-sm" onclick="changeMonth(1)">Siguiente ›</button>
    </div>
  </div>
  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">Nueva actividad</h2>
    <form id="activityForm">
      <input type="hidden" id="editId">

      <div class="form-group">
        <label for="title">Título *</label>
        <input type="text" id="title" required placeholder="Nombre de la actividad" style="width:100%; padding:9px 12px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary);">
      </div>

      <div class="form-row" style="display:grid; grid-template-columns: 1fr 92px 140px; gap:12px; align-items:center;">
        <div>
          <div class="form-group">
            <label for="category">Categoría</label>
            <input type="text" id="category" placeholder="Ej: Trabajo, Personal, Estudio" list="categoryList" style="width:100%; padding:9px 12px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary);">
            <datalist id="categoryList"></datalist>
          </div>
        </div>

        <div style="width:92px;margin-left:8px;">
          <div class="form-group" style="margin-bottom:0;">
            <label for="categoryColor" style="display:block;font-size:0.85rem;color:var(--text-secondary);margin-bottom:6px;">Color</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <input type="color" id="categoryColor" value="#58a6ff" title="Color de la categoría" style="width:56px;height:36px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);" />
              <div id="categoryPalette" aria-hidden="false" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
            </div>
          </div>
        </div>

        <div>
          <div class="form-group">
            <label for="urgency">Urgencia</label>
            <select id="urgency" style="width:100%; padding:9px 12px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary);">
              <option value="low">Baja</option>
              <option value="medium" selected>Media</option>
              <option value="high">Alta</option>
              <option value="urgent">Urgente</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-row" style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;">
        <div class="form-group">
          <label for="dueDate">Fecha de vencimiento</label>
          <input type="date" id="dueDate" style="width:100%; padding:9px 12px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary);">
        </div>
        <div class="form-group">
          <label for="recurrence">Periodicidad</label>
          <select id="recurrence" onchange="toggleRecurrenceOptions()" style="width:100%; padding:9px 12px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary);">
            <option value="none">Sin repetición</option>
            <option value="weekly">Semanal</option>
            <option value="monthly">Mensual</option>
          </select>
        </div>
      </div>

      <div class="recurrence-options" id="recurrenceWeekly" style="display:none; margin-top:10px;">
        <label style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;display:block;">Días de la semana</label>
        <div class="weekdays" id="weekdays">
          <button type="button" class="weekday" data-day="1">L</button>
          <button type="button" class="weekday" data-day="2">M</button>
          <button type="button" class="weekday" data-day="3">X</button>
          <button type="button" class="weekday" data-day="4">J</button>
          <button type="button" class="weekday" data-day="5">V</button>
          <button type="button" class="weekday" data-day="6">S</button>
          <button type="button" class="weekday" data-day="0">D</button>
        </div>
      </div>

      <div class="recurrence-options" id="recurrenceMonthly" style="display:none; margin-top:10px;">
        <div class="form-group" style="margin-bottom:0;">
          <label for="monthlyDay">Día del mes (1-31)</label>
          <input type="number" id="monthlyDay" min="1" max="31" placeholder="Ej: 15" style="width:100%; padding:9px 12px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary);">
        </div>
      </div>

      <div class="form-group" style="margin-top:12px;">
        <label>Subtareas</label>
        <div class="subtasks-form" id="subtasksForm">
          <div class="subtask-input-row" style="display:flex; gap:8px;">
            <input type="text" placeholder="Nueva subtarea..." class="subtask-input" style="flex:1; padding:9px 12px; background:var(--bg-tertiary); border:1px solid var(--border); border-radius:6px; color:var(--text-primary);">
            <button type="button" class="btn btn-sm" onclick="addSubtaskInput()">+</button>
          </div>
        </div>
      </div>

      <div class="modal-actions" style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
        <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ========== STORAGE (compatible con sandbox) ==========
  const memoryStore = { data: [] };

  function loadActivities(){ try{ const raw = localStorage.getItem('kanbanActivities'); if(raw) return JSON.parse(raw); }catch(e){} return memoryStore.data; }
  function persist(activities){ memoryStore.data = activities; try{ localStorage.setItem('kanbanActivities', JSON.stringify(activities)); }catch(e){} }

  // ---------- Helpers de color (JS) ----------
  function hexToRgb(hex){ if(!hex) return null; let h = hex.replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join(''); const bigint = parseInt(h,16); return [(bigint>>16)&255, (bigint>>8)&255, bigint&255]; }
  function hexToRgba(hex,a){ const rgb = hexToRgb(hex) || [88,166,255]; return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }
  function luminance(hex){ const rgb = hexToRgb(hex); if(!rgb) return 0; const a = rgb.map(v=>{ v/=255; return v<=0.03928? v/12.92: Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*a[0] + 0.7152*a[1] + 0.0722*a[2]; }
  function contrastColor(hex){ if(!hex) return '#000000'; return luminance(hex) > 0.5 ? '#0d1117' : '#ffffff'; }

  function getCategoryColor(cat){ if(!cat) return null; const found = activities.find(a=>a.category===cat && a.categoryColor); return found ? found.categoryColor : null; }

  // Palette: limit to 10 colors
  const CATEGORY_PALETTE = [ '#58a6ff', '#7dd3fc', '#60a5fa', '#a78bfa', '#f97316', '#fb7185', '#34d399', '#f59e0b', '#ef4444', '#10b981' ];

  function renderCategoryPalette(){ const pal = document.getElementById('categoryPalette'); if(!pal) return; pal.innerHTML = ''; CATEGORY_PALETTE.forEach(hex=>{ const btn = document.createElement('button'); btn.type='button'; btn.className='category-swatch'; btn.title=hex; btn.setAttribute('aria-label', `Seleccionar color ${hex}`); btn.style.width='28px'; btn.style.height='28px'; btn.style.borderRadius='6px'; btn.style.border='1px solid rgba(0,0,0,0.12)'; btn.style.background=hex; btn.style.cursor='pointer'; btn.style.padding='0'; btn.style.outline='none'; btn.addEventListener('click', ()=>{ const colorInput = document.getElementById('categoryColor'); if(colorInput) colorInput.value = hex; }); pal.appendChild(btn); }); }

  function ensureCategoryColorIsAllowed(){ const colorInput = document.getElementById('categoryColor'); if(!colorInput) return; const val = (colorInput.value||'').toLowerCase(); if(!CATEGORY_PALETTE.map(c=>c.toLowerCase()).includes(val)){ colorInput.value = CATEGORY_PALETTE[0]; } }

  let activities = loadActivities();
  let currentFilter = 'all';
  let calendarDate = new Date();
  let draggedId = null;

  document.addEventListener('DOMContentLoaded', ()=>{
    render();

    document.querySelectorAll('.weekday').forEach(btn=>{ btn.addEventListener('click', ()=> btn.classList.toggle('active')); });

    // inicializar paleta
    renderCategoryPalette();

    // rellenar color al teclear categoría y capturar submit
    const catInput = document.getElementById('category');
    const colorInput = document.getElementById('categoryColor');
    if(catInput && colorInput){
      catInput.addEventListener('input', ()=>{
        const col = getCategoryColor(catInput.value.trim());
        if(col && CATEGORY_PALETTE.map(c=>c.toLowerCase()).includes(col.toLowerCase())){
          colorInput.value = col;
        } else {
          colorInput.value = CATEGORY_PALETTE[0];
        }
      });
    }

    const form = document.getElementById('activityForm');
    if(form){
      form.addEventListener('submit', (e)=>{
        // aseguramos color permitido antes de guardar
        ensureCategoryColorIsAllowed();
        if(typeof saveActivity === 'function'){
          saveActivity(e);
        } else {
          e.preventDefault();
        }
      });
    }
  });

  function save(){ persist(activities); }

  // ---- Core render and basic functions (simplified but compatible) ----
  function switchView(view){ const board = document.getElementById('boardView'); const cal = document.getElementById('calendarView'); document.getElementById('btnBoard').classList.remove('active'); document.getElementById('btnCalendar').classList.remove('active'); if(view==='board'){ board.style.display='grid'; cal.style.display='none'; document.getElementById('btnBoard').classList.add('active'); } else { board.style.display='none'; cal.style.display='block'; document.getElementById('btnCalendar').classList.add('active'); renderCalendar(); } }

  function openModal(editId){ document.getElementById('modal').classList.add('open'); if(editId){ /* populate form for edit */ } else { document.getElementById('activityForm').reset(); document.getElementById('categoryColor').value = CATEGORY_PALETTE[0]; } }
  function closeModal(){ document.getElementById('modal').classList.remove('open'); }

  // drag/drop placeholders
  function allowDrop(e){ e.preventDefault(); }
  function drop(e, status){ e.preventDefault(); const id = draggedId; if(!id) return; const idx = activities.findIndex(a=>a.id===id); if(idx>-1){ activities[idx].status = status; save(); render(); } draggedId = null; }
  function dragStart(e,id){ draggedId = id; }

  function clearCompleted(){ activities = activities.filter(a=>a.status!=='completed'); save(); render(); }

  // basic renderer
  function render(){ // columns
    const cols = { pending: document.getElementById('col-pending'), 'in-progress': document.getElementById('col-in-progress'), completed: document.getElementById('col-completed') };
    Object.values(cols).forEach(c=>{ if(c) c.innerHTML=''; });
    activities.forEach(act=>{
      if(currentFilter!=='all' && act.category !== currentFilter) return;
      const card = document.createElement('div'); card.className='card'; card.draggable = true; card.addEventListener('dragstart', ()=>dragStart(event, act.id));
      card.innerHTML = `<div class="card-title">${escapeHtml(act.title)}</div>`;
      const tags = document.createElement('div'); tags.className='card-tags'; if(act.category){ const tc = act.categoryColor || CATEGORY_PALETTE[0]; const t = document.createElement('span'); t.className='tag tag-category'; t.style.background = hexToRgba(tc, 0.12); t.style.color = contrastColor(tc); t.style.border = '1px solid rgba(0,0,0,0.08)'; t.textContent = act.category; tags.appendChild(t); }
      card.appendChild(tags);
      const col = cols[act.status || 'pending']; if(col) col.appendChild(card);
    });
    // counts
    document.getElementById('count-pending').textContent = activities.filter(a=>a.status==='pending').length;
    document.getElementById('count-in-progress').textContent = activities.filter(a=>a.status==='in-progress').length;
    document.getElementById('count-completed').textContent = activities.filter(a=>a.status==='completed').length;
  }

  function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Calendar (simple)
  function renderCalendar(){ const grid = document.getElementById('calendarGrid'); if(!grid) return; grid.innerHTML=''; const start = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1); const month = calendarDate.getMonth(); const year = calendarDate.getFullYear(); document.getElementById('calMonthYear').textContent = start.toLocaleString('es-ES', { month:'long', year:'numeric' }); const firstDay = new Date(year, month, 1).getDay(); // 0-6
    // add day names header
    const dayNames = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    dayNames.forEach(n=>{ const el = document.createElement('div'); el.className='cal-day-name'; el.textContent = n; grid.appendChild(el); });
    // fill days
    const daysInMonth = new Date(year, month+1, 0).getDate();
    // pad start
    const pad = (firstDay + 6)%7; // align with Lunes if needed
    for(let i=0;i<pad;i++){ const d = document.createElement('div'); d.className='cal-day other-month'; grid.appendChild(d); }
    for(let d=1; d<=daysInMonth; d++){ const cell = document.createElement('div'); cell.className='cal-day'; const dateEl = document.createElement('div'); dateEl.className='cal-date'; dateEl.textContent = d; cell.appendChild(dateEl); grid.appendChild(cell); }
  }

  function changeMonth(delta){ calendarDate.setMonth(calendarDate.getMonth() + delta); renderCalendar(); }
  function goToToday(){ calendarDate = new Date(); renderCalendar(); }

  // saveActivity: read form and persist
  function saveActivity(e){ e.preventDefault(); const title = document.getElementById('title').value.trim(); if(!title) return alert('El título es obligatorio'); const category = document.getElementById('category').value.trim(); const categoryColor = document.getElementById('categoryColor').value; const urgency = document.getElementById('urgency').value; const dueDate = document.getElementById('dueDate').value; const id = document.getElementById('editId').value || `a_${Date.now()}`; const existing = activities.find(a=>a.id===id); ensureCategoryColorIsAllowed(); const color = CATEGORY_PALETTE.find(c=>c.toLowerCase()===categoryColor.toLowerCase()) || CATEGORY_PALETTE[0]; const payload = { id, title, category: category||'General', categoryColor: color, urgency, dueDate, status: 'pending' };
    if(existing){ Object.assign(existing, payload); } else { activities.push(payload); }
    save(); closeModal(); render(); }

  // minor utils for subtasks (placeholder)
  function addSubtaskInput(){ const container = document.getElementById('subtasksForm'); const row = document.createElement('div'); row.className='subtask-input-row'; row.style.display='flex'; row.style.gap='8px'; const input = document.createElement('input'); input.type='text'; input.placeholder='Nueva subtarea...'; input.style.flex='1'; input.className='subtask-input'; const btn = document.createElement('button'); btn.type='button'; btn.className='btn btn-sm'; btn.textContent='-'; btn.onclick = ()=> row.remove(); row.appendChild(input); row.appendChild(btn); container.appendChild(row); }

  // init
  render();
</script>
</body>
</html>
