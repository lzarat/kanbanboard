<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Tracker - Seguimiento de Actividades</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --bg-card: #1c2128;
    --bg-hover: #2d333b;
    --border: #30363d;
    --border-light: #484f58;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --success: #3fb950;
    --warning: #d29922;
    --danger: #f85149;
    --urgent: #ff6b6b;
    --high: #ffa657;
    --medium: #d2a8ff;
    --low: #7ee787;
    --today: #58a6ff;
    --progress-0: #484f58;
    --progress-25: #d29922;
    --progress-50: #58a6ff;
    --progress-75: #a371f7;
    --progress-100: #3fb950;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Roboto Condensed', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* Header */
  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    background: var(--bg-hover);
    border-color: var(--border-light);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0d1117;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .btn-danger {
    background: transparent;
    border-color: var(--danger);
    color: var(--danger);
  }

  .btn-danger:hover {
    background: rgba(248, 81, 73, 0.15);
  }

  .btn-success {
    background: transparent;
    border-color: var(--success);
    color: var(--success);
  }

  .btn-success:hover {
    background: rgba(63, 185, 80, 0.15);
  }

  .btn-sm {
    padding: 4px 10px;
    font-size: 0.8rem;
  }

  .view-toggle {
    display: flex;
    background: var(--bg-tertiary);
    border-radius: 6px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .view-toggle button {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 8px 14px;
    cursor: pointer;
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
  }

  .view-toggle button.active {
    background: var(--accent);
    color: #0d1117;
  }

  /* Filters */
  .filters {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-right: 4px;
  }

  .tag-filter {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 0.8rem;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }

  .tag-filter:hover,
  .tag-filter.active {
    background: var(--accent);
    color: #0d1117;
    border-color: var(--accent);
  }

  /* Board */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 20px 24px;
    min-height: calc(100vh - 140px);
  }

  @media (max-width: 900px) {
    .board { grid-template-columns: 1fr; }
  }

  .column {
    background: var(--bg-secondary);
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 160px);
  }

  .column-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .column-title {
    font-size: 0.95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .column-count {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }

  .column-body {
    padding: 12px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ========== CARDS ========== */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    cursor: grab;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    border-color: var(--border-light);
    filter: brightness(1.05);
  }

  .card.dragging {
    opacity: 0.5;
    cursor: grabbing;
  }

  /* Status color accents */
  .card.status-pending {
    border-left: 4px solid #f85149;
    background: linear-gradient(135deg, rgba(248, 81, 73, 0.08) 0%, var(--bg-card) 60%);
  }

  .card.status-in-progress {
    border-left: 4px solid #e3b341;
    background: linear-gradient(135deg, rgba(227, 179, 65, 0.10) 0%, var(--bg-card) 60%);
  }

  .card.status-completed {
    border-left: 4px solid #3fb950;
    background: linear-gradient(135deg, rgba(63, 185, 80, 0.08) 0%, var(--bg-card) 60%);
  }

  /* Subtle urgency gradient overlay */
  .card.urgency-urgent::before,
  .card.urgency-high::before,
  .card.urgency-medium::before,
  .card.urgency-low::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0.18;
    z-index: 0;
  }

  .card.urgency-urgent::before {
    background: linear-gradient(160deg, rgba(255, 107, 107, 0.55) 0%, transparent 55%);
  }

  .card.urgency-high::before {
    background: linear-gradient(160deg, rgba(255, 166, 87, 0.50) 0%, transparent 55%);
  }

  .card.urgency-medium::before {
    background: linear-gradient(160deg, rgba(210, 168, 255, 0.45) 0%, transparent 55%);
  }

  .card.urgency-low::before {
    background: linear-gradient(160deg, rgba(126, 231, 135, 0.40) 0%, transparent 55%);
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .card.overdue {
    box-shadow: inset 0 0 0 1px rgba(248, 81, 73, 0.4);
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--text-primary);
    word-break: break-word;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .tag {
    font-size: 0.7rem;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.02em;
  }

  .tag-category {
    background: rgba(88, 166, 255, 0.15);
    color: var(--accent);
    border: 1px solid rgba(88, 166, 255, 0.3);
  }

  .tag-urgency { border: 1px solid transparent; }

  .tag-urgency.urgent {
    background: rgba(248, 81, 73, 0.25);
    color: var(--urgent);
    border-color: rgba(248, 81, 73, 0.45);
  }

  .tag-urgency.high {
    background: rgba(255, 166, 87, 0.25);
    color: var(--high);
    border-color: rgba(255, 166, 87, 0.45);
  }

  .tag-urgency.medium {
    background: rgba(210, 168, 255, 0.25);
    color: var(--medium);
    border-color: rgba(210, 168, 255, 0.45);
  }

  .tag-urgency.low {
    background: rgba(126, 231, 135, 0.18);
    color: var(--low);
    border-color: rgba(126, 231, 135, 0.35);
  }

  .tag-due {
    background: rgba(139, 148, 158, 0.15);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .tag-due.today {
    background: rgba(88, 166, 255, 0.2);
    color: var(--today);
    border-color: rgba(88, 166, 255, 0.4);
    font-weight: 600;
  }

  .tag-due.overdue {
    background: rgba(248, 81, 73, 0.2);
    color: var(--danger);
    border-color: rgba(248, 81, 73, 0.4);
    font-weight: 600;
  }

  .tag-recurrence {
    background: rgba(163, 113, 247, 0.15);
    color: #a371f7;
    border: 1px solid rgba(163, 113, 247, 0.3);
  }

  /* Progress */
  .progress-section { margin-top: 10px; }

  .progress-buttons {
    display: flex;
    gap: 4px;
  }

  .progress-btn {
    flex: 1;
    padding: 5px 0;
    font-size: 0.7rem;
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-tertiary);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .progress-btn:hover {
    border-color: var(--border-light);
    color: var(--text-secondary);
  }

  .progress-btn.active[data-value="0"] {
    background: var(--progress-0);
    border-color: var(--progress-0);
    color: #fff;
  }

  .progress-btn.active[data-value="25"] {
    background: var(--progress-25);
    border-color: var(--progress-25);
    color: #0d1117;
  }

  .progress-btn.active[data-value="50"] {
    background: var(--progress-50);
    border-color: var(--progress-50);
    color: #0d1117;
  }

  .progress-btn.active[data-value="75"] {
    background: var(--progress-75);
    border-color: var(--progress-75);
    color: #fff;
  }

  .progress-btn.active[data-value="100"] {
    background: var(--progress-100);
    border-color: var(--progress-100);
    color: #0d1117;
  }

  /* Subtasks */
  .subtasks {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }

  .subtask {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    font-size: 0.85rem;
  }

  .subtask input[type="checkbox"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    cursor: pointer;
  }

  .subtask.completed span {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .card-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s;
  }

  .modal-overlay.open {
    opacity: 1;
    visibility: visible;
  }

  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
  }

  .modal h2 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 0.9rem;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .recurrence-options {
    display: none;
    margin-top: 10px;
    padding: 12px;
    background: var(--bg-tertiary);
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .recurrence-options.show { display: block; }

  .weekdays {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .weekday {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .weekday.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0d1117;
  }

  .subtasks-form { margin-top: 8px; }

  .subtask-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }

  .subtask-input-row input { flex: 1; }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
  }

  /* Calendar */
  .calendar-view {
    display: none;
    padding: 20px 24px;
  }

  .calendar-view.active { display: block; }
  .board.hidden { display: none; }

  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .calendar-header h2 {
    font-size: 1.1rem;
    font-weight: 600;
  }

  .calendar-nav { display: flex; gap: 8px; }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .cal-day-name {
    background: var(--bg-secondary);
    padding: 10px;
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .cal-day {
    background: var(--bg-secondary);
    min-height: 90px;
    padding: 6px;
    position: relative;
  }

  .cal-day.other-month {
    background: var(--bg-primary);
    opacity: 0.5;
  }

  .cal-day.today {
    background: rgba(88, 166, 255, 0.08);
  }

  .cal-day.today .cal-date {
    background: var(--accent);
    color: #0d1117;
    font-weight: 700;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cal-date {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .cal-event {
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 3px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }

  .cal-event.pending { background: rgba(248, 81, 73, 0.25); color: #ff8b8b; }
  .cal-event.in-progress { background: rgba(227, 179, 65, 0.25); color: #e3b341; }
  .cal-event.completed { background: rgba(63, 185, 80, 0.2); color: var(--success); }
  .cal-event.overdue { background: rgba(248, 81, 73, 0.35); color: var(--danger); }

  .empty-column {
    text-align: center;
    padding: 30px 10px;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }
</style>
</head>
<body>

<header class="header">
  <h1>◈ Seguimiento de Actividades</h1>
  <div class="header-actions">
    <div class="view-toggle">
      <button id="btnBoard" class="active" onclick="switchView('board')">Tablero</button>
      <button id="btnCalendar" onclick="switchView('calendar')">Calendario</button>
    </div>
    <button class="btn btn-primary" onclick="openModal()">+ Nueva actividad</button>
  </div>
</header>

<div class="filters" id="filters">
  <span class="filter-label">Filtrar por categoría:</span>
  <button class="tag-filter active" data-cat="all" onclick="filterByCategory('all')">Todas</button>
</div>

<div class="board" id="boardView">
  <div class="column" data-status="pending">
    <div class="column-header">
      <div class="column-title">
        <span>Pendientes</span>
        <span class="column-count" id="count-pending">0</span>
      </div>
    </div>
    <div class="column-body" id="col-pending" ondragover="allowDrop(event)" ondrop="drop(event, 'pending')"></div>
  </div>

  <div class="column" data-status="in-progress">
    <div class="column-header">
      <div class="column-title">
        <span>En progreso</span>
        <span class="column-count" id="count-in-progress">0</span>
      </div>
    </div>
    <div class="column-body" id="col-in-progress" ondragover="allowDrop(event)" ondrop="drop(event, 'in-progress')"></div>
  </div>

  <div class="column" data-status="completed">
    <div class="column-header">
      <div class="column-title">
        <span>Completadas</span>
        <span class="column-count" id="count-completed">0</span>
      </div>
      <button class="btn btn-sm btn-danger" onclick="clearCompleted()" title="Limpiar completadas">Limpiar</button>
    </div>
    <div class="column-body" id="col-completed" ondragover="allowDrop(event)" ondrop="drop(event, 'completed')"></div>
  </div>
</div>

<div class="calendar-view" id="calendarView">
  <div class="calendar-header">
    <h2 id="calMonthYear"></h2>
    <div class="calendar-nav">
      <button class="btn btn-sm" onclick="changeMonth(-1)">‹ Anterior</button>
      <button class="btn btn-sm" onclick="goToToday()">Hoy</button>
      <button class="btn btn-sm" onclick="changeMonth(1)">Siguiente ›</button>
    </div>
  </div>
  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Nueva actividad</h2>
    <form id="activityForm" onsubmit="saveActivity(event)">
      <input type="hidden" id="editId">

      <div class="form-group">
        <label for="title">Título *</label>
        <input type="text" id="title" required placeholder="Nombre de la actividad">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">Categoría</label>
          <input type="text" id="category" placeholder="Ej: Trabajo, Personal, Estudio" list="categoryList">
          <datalist id="categoryList"></datalist>
        </div>
        <div class="form-group">
          <label for="urgency">Urgencia</label>
          <select id="urgency">
            <option value="low">Baja</option>
            <option value="medium" selected>Media</option>
            <option value="high">Alta</option>
            <option value="urgent">Urgente</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dueDate">Fecha de vencimiento</label>
          <input type="date" id="dueDate">
        </div>
        <div class="form-group">
          <label for="recurrence">Periodicidad</label>
          <select id="recurrence" onchange="toggleRecurrenceOptions()">
            <option value="none">Sin repetición</option>
            <option value="weekly">Semanal</option>
            <option value="monthly">Mensual</option>
          </select>
        </div>
      </div>

      <div class="recurrence-options" id="recurrenceWeekly">
        <label style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;display:block;">Días de la semana</label>
        <div class="weekdays" id="weekdays">
          <button type="button" class="weekday" data-day="1">L</button>
          <button type="button" class="weekday" data-day="2">M</button>
          <button type="button" class="weekday" data-day="3">X</button>
          <button type="button" class="weekday" data-day="4">J</button>
          <button type="button" class="weekday" data-day="5">V</button>
          <button type="button" class="weekday" data-day="6">S</button>
          <button type="button" class="weekday" data-day="0">D</button>
        </div>
      </div>

      <div class="recurrence-options" id="recurrenceMonthly">
        <div class="form-group" style="margin-bottom:0;">
          <label for="monthlyDay">Día del mes (1-31)</label>
          <input type="number" id="monthlyDay" min="1" max="31" placeholder="Ej: 15">
        </div>
      </div>

      <div class="form-group">
        <label>Subtareas</label>
        <div class="subtasks-form" id="subtasksForm">
          <div class="subtask-input-row">
            <input type="text" placeholder="Nueva subtarea..." class="subtask-input">
            <button type="button" class="btn btn-sm" onclick="addSubtaskInput()">+</button>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ========== STORAGE (compatible con sandbox) ==========
  const memoryStore = { data: [] };

  function loadActivities() {
    try {
      const raw = localStorage.getItem('kanbanActivities');
      if (raw) return JSON.parse(raw);
    } catch (e) {
      // localStorage bloqueado (sandbox) → usamos memoria
    }
    return memoryStore.data;
  }

  function persist(activities) {
    memoryStore.data = activities;
    try {
      localStorage.setItem('kanbanActivities', JSON.stringify(activities));
    } catch (e) {
      // silencioso
    }
  }

  let activities = loadActivities();
  let currentFilter = 'all';
  let calendarDate = new Date();
  let draggedId = null;

  document.addEventListener('DOMContentLoaded', () => {
    render();
    document.querySelectorAll('.weekday').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('active'));
    });
  });

  function save() {
    persist(activities);
  }

  // ========== RENDER ==========
  function render() {
    renderFilters();
    renderBoard();
    renderCalendar();
  }

  function renderFilters() {
    const cats = [...new Set(activities.map(a => a.category).filter(Boolean))];
    const container = document.getElementById('filters');
    container.querySelectorAll('.tag-filter:not([data-cat="all"])').forEach(el => el.remove());

    const datalist = document.getElementById('categoryList');
    datalist.innerHTML = '';

    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'tag-filter' + (currentFilter === cat ? ' active' : '');
      btn.dataset.cat = cat;
      btn.textContent = cat;
      btn.onclick = () => filterByCategory(cat);
      container.appendChild(btn);

      const opt = document.createElement('option');
      opt.value = cat;
      datalist.appendChild(opt);
    });
  }

  function filterByCategory(cat) {
    currentFilter = cat;
    document.querySelectorAll('.tag-filter').forEach(b => {
      b.classList.toggle('active', b.dataset.cat === cat);
    });
    renderBoard();
  }

  function getFiltered() {
    if (currentFilter === 'all') return activities;
    return activities.filter(a => a.category === currentFilter);
  }

  function sortByDue(list) {
    return [...list].sort((a, b) => {
      if (!a.dueDate && !b.dueDate) return 0;
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return new Date(a.dueDate) - new Date(b.dueDate);
    });
  }

  function renderBoard() {
    const statuses = ['pending', 'in-progress', 'completed'];
    const filtered = getFiltered();

    statuses.forEach(status => {
      const col = document.getElementById('col-' + status);
      const items = sortByDue(filtered.filter(a => a.status === status));
      document.getElementById('count-' + status).textContent = items.length;

      if (items.length === 0) {
        col.innerHTML = '<div class="empty-column">Sin actividades</div>';
        return;
      }

      col.innerHTML = items.map(a => createCardHTML(a)).join('');
    });
  }

  function createCardHTML(a) {
    const isOverdue = a.dueDate && a.status !== 'completed' && new Date(a.dueDate) < startOfToday();
    const dueInfo = formatDue(a.dueDate);
    const urgencyLabels = { low: 'Baja', medium: 'Media', high: 'Alta', urgent: 'Urgente' };

    let tags = '';
    if (a.category) tags += `<span class="tag tag-category">${esc(a.category)}</span>`;
    tags += `<span class="tag tag-urgency ${a.urgency}">${urgencyLabels[a.urgency] || a.urgency}</span>`;
    if (dueInfo) tags += `<span class="tag tag-due ${dueInfo.class}">${dueInfo.text}</span>`;
    if (a.recurrence && a.recurrence !== 'none') {
      tags += `<span class="tag tag-recurrence">${recurrenceLabel(a)}</span>`;
    }

    // Progress only visible in "in-progress"
    let progressHTML = '';
    if (a.status === 'in-progress') {
      const vals = [0, 25, 50, 75, 100];
      progressHTML = `
        <div class="progress-section">
          <div class="progress-buttons">
            ${vals.map(v => `
              <button class="progress-btn ${a.progress === v ? 'active' : ''}"
                data-value="${v}"
                onclick="setProgress('${a.id}', ${v})">${v}%</button>
            `).join('')}
          </div>
        </div>`;
    }

    // Subtasks
    let subtasksHTML = '';
    if (a.subtasks && a.subtasks.length) {
      subtasksHTML = `<div class="subtasks">
        ${a.subtasks.map((s, i) => `
          <div class="subtask ${s.done ? 'completed' : ''}">
            <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask('${a.id}', ${i})">
            <span>${esc(s.text)}</span>
          </div>
        `).join('')}
      </div>`;
    }

    // Actions
    let actions = `
      <button class="btn btn-sm" onclick="editActivity('${a.id}')">Editar</button>
      <button class="btn btn-sm btn-danger" onclick="deleteActivity('${a.id}')">Eliminar</button>`;

    if (isOverdue) {
      actions = `<button class="btn btn-sm btn-primary" onclick="reschedule('${a.id}')">Reagendar</button>` + actions;
    }

    // Botón Reutilizar solo en completadas
    if (a.status === 'completed') {
      actions = `<button class="btn btn-sm btn-success" onclick="reuseActivity('${a.id}')">Reutilizar</button>` + actions;
    }

    const statusClass = 'status-' + a.status;
    const urgencyClass = 'urgency-' + (a.urgency || 'medium');

    return `
      <div class="card ${statusClass} ${urgencyClass} ${isOverdue ? 'overdue' : ''}"
           draggable="true"
           ondragstart="dragStart(event, '${a.id}')"
           ondragend="dragEnd(event)"
           data-id="${a.id}">
        <div class="card-title">${esc(a.title)}</div>
        <div class="card-tags">${tags}</div>
        ${progressHTML}
        ${subtasksHTML}
        <div class="card-actions">${actions}</div>
      </div>`;
  }

  function formatDue(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr + 'T00:00:00');
    const today = startOfToday();
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);

    const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    const dayName = days[d.getDay()];
    const formatted = `${dayName} ${d.getDate()}/${d.getMonth() + 1}`;

    if (d < today) return { text: `⚠ ${formatted}`, class: 'overdue' };
    if (d.getTime() === today.getTime()) return { text: `Hoy · ${formatted}`, class: 'today' };
    if (d.getTime() === tomorrow.getTime()) return { text: `Mañana · ${formatted}`, class: '' };
    return { text: formatted, class: '' };
  }

  function recurrenceLabel(a) {
    if (a.recurrence === 'weekly' && a.weekdays && a.weekdays.length) {
      const names = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
      return 'Sem: ' + a.weekdays.map(d => names[d]).join('');
    }
    if (a.recurrence === 'monthly' && a.monthlyDay) {
      return `Men: día ${a.monthlyDay}`;
    }
    return a.recurrence === 'weekly' ? 'Semanal' : 'Mensual';
  }

  function startOfToday() {
    const t = new Date();
    t.setHours(0, 0, 0, 0);
    return t;
  }

  function esc(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ========== DRAG & DROP ==========
  function dragStart(e, id) {
    draggedId = id;
    e.target.classList.add('dragging');
  }

  function dragEnd(e) {
    e.target.classList.remove('dragging');
    draggedId = null;
  }

  function allowDrop(e) { e.preventDefault(); }

  function drop(e, status) {
    e.preventDefault();
    if (!draggedId) return;
    const act = activities.find(a => a.id === draggedId);
    if (!act) return;

    act.status = status;
    if (status === 'completed') act.progress = 100;
    if (status === 'pending') act.progress = 0;
    if (status === 'in-progress' && act.progress === 0) act.progress = 25;

    if (status === 'completed' && act.recurrence && act.recurrence !== 'none') {
      spawnNextOccurrence(act);
    }

    save();
    render();
  }

  function spawnNextOccurrence(act) {
    const next = {
      ...act,
      id: crypto.randomUUID(),
      status: 'pending',
      progress: 0,
      subtasks: (act.subtasks || []).map(s => ({ ...s, done: false }))
    };

    if (act.recurrence === 'weekly' && act.weekdays && act.weekdays.length) {
      const base = act.dueDate ? new Date(act.dueDate + 'T00:00:00') : new Date();
      base.setDate(base.getDate() + 1);
      for (let i = 0; i < 14; i++) {
        if (act.weekdays.includes(base.getDay())) {
          next.dueDate = base.toISOString().slice(0, 10);
          break;
        }
        base.setDate(base.getDate() + 1);
      }
    } else if (act.recurrence === 'monthly' && act.monthlyDay) {
      const base = act.dueDate ? new Date(act.dueDate + 'T00:00:00') : new Date();
      base.setMonth(base.getMonth() + 1);
      const day = Math.min(act.monthlyDay, daysInMonth(base.getFullYear(), base.getMonth()));
      base.setDate(day);
      next.dueDate = base.toISOString().slice(0, 10);
    }

    activities.push(next);
  }

  function daysInMonth(y, m) {
    return new Date(y, m + 1, 0).getDate();
  }

  // ========== ACTIONS ==========
  function setProgress(id, value) {
    const act = activities.find(a => a.id === id);
    if (!act) return;
    act.progress = value;
    if (value === 100) {
      act.status = 'completed';
      if (act.recurrence && act.recurrence !== 'none') spawnNextOccurrence(act);
    }
    save();
    render();
  }

  function toggleSubtask(id, index) {
    const act = activities.find(a => a.id === id);
    if (!act || !act.subtasks) return;
    act.subtasks[index].done = !act.subtasks[index].done;
    save();
    render();
  }

  function deleteActivity(id) {
    if (!confirm('¿Eliminar esta actividad?')) return;
    activities = activities.filter(a => a.id !== id);
    save();
    render();
  }

  function clearCompleted() {
    if (!confirm('¿Eliminar todas las actividades completadas?')) return;
    activities = activities.filter(a => a.status !== 'completed');
    save();
    render();
  }

  function reschedule(id) {
    const act = activities.find(a => a.id === id);
    if (!act) return;
    const newDate = prompt('Nueva fecha de vencimiento (YYYY-MM-DD):', act.dueDate || '');
    if (!newDate) return;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
      alert('Formato inválido. Usa YYYY-MM-DD');
      return;
    }
    act.dueDate = newDate;
    save();
    render();
  }

  // ========== REUTILIZAR ACTIVIDAD COMPLETADA ==========
  function reuseActivity(id) {
    const act = activities.find(a => a.id === id);
    if (!act) return;

    const copy = {
      ...act,
      id: crypto.randomUUID(),
      status: 'pending',
      progress: 0,
      createdAt: new Date().toISOString(),
      subtasks: (act.subtasks || []).map(s => ({ text: s.text, done: false }))
    };

    // Opcional: limpiar fecha de vencimiento o dejarla
    // copy.dueDate = null;  // descomenta si quieres que no herede la fecha

    activities.push(copy);
    save();
    render();
  }

  // ========== MODAL ==========
  function openModal(editId = null) {
    document.getElementById('modal').classList.add('open');
    document.getElementById('activityForm').reset();
    document.getElementById('editId').value = '';
    document.getElementById('modalTitle').textContent = 'Nueva actividad';
    document.getElementById('recurrenceWeekly').classList.remove('show');
    document.getElementById('recurrenceMonthly').classList.remove('show');
    document.querySelectorAll('.weekday').forEach(b => b.classList.remove('active'));

    const sf = document.getElementById('subtasksForm');
    sf.innerHTML = `
      <div class="subtask-input-row">
        <input type="text" placeholder="Nueva subtarea..." class="subtask-input">
        <button type="button" class="btn btn-sm" onclick="addSubtaskInput()">+</button>
      </div>`;

    if (editId) {
      const act = activities.find(a => a.id === editId);
      if (!act) return;
      document.getElementById('editId').value = act.id;
      document.getElementById('modalTitle').textContent = 'Editar actividad';
      document.getElementById('title').value = act.title;
      document.getElementById('category').value = act.category || '';
      document.getElementById('urgency').value = act.urgency || 'medium';
      document.getElementById('dueDate').value = act.dueDate || '';
      document.getElementById('recurrence').value = act.recurrence || 'none';
      toggleRecurrenceOptions();

      if (act.recurrence === 'weekly' && act.weekdays) {
        act.weekdays.forEach(d => {
          const btn = document.querySelector(`.weekday[data-day="${d}"]`);
          if (btn) btn.classList.add('active');
        });
      }
      if (act.recurrence === 'monthly' && act.monthlyDay) {
        document.getElementById('monthlyDay').value = act.monthlyDay;
      }

      if (act.subtasks && act.subtasks.length) {
        sf.innerHTML = '';
        act.subtasks.forEach(s => {
          const row = document.createElement('div');
          row.className = 'subtask-input-row';
          row.innerHTML = `
            <input type="text" class="subtask-input" value="${esc(s.text)}">
            <button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">×</button>`;
          sf.appendChild(row);
        });
        const addRow = document.createElement('div');
        addRow.className = 'subtask-input-row';
        addRow.innerHTML = `
          <input type="text" placeholder="Nueva subtarea..." class="subtask-input">
          <button type="button" class="btn btn-sm" onclick="addSubtaskInput()">+</button>`;
        sf.appendChild(addRow);
      }
    }
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  function editActivity(id) {
    openModal(id);
  }

  function toggleRecurrenceOptions() {
    const val = document.getElementById('recurrence').value;
    document.getElementById('recurrenceWeekly').classList.toggle('show', val === 'weekly');
    document.getElementById('recurrenceMonthly').classList.toggle('show', val === 'monthly');
  }

  function addSubtaskInput() {
    const sf = document.getElementById('subtasksForm');
    const row = document.createElement('div');
    row.className = 'subtask-input-row';
    row.innerHTML = `
      <input type="text" placeholder="Nueva subtarea..." class="subtask-input">
      <button type="button" class="btn btn-sm" onclick="this.parentElement.remove()">×</button>`;
    const last = sf.querySelector('.subtask-input-row:last-child');
    if (last && last.querySelector('button')?.textContent === '+') {
      sf.insertBefore(row, last);
    } else {
      sf.appendChild(row);
    }
  }

  function saveActivity(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const title = document.getElementById('title').value.trim();
    if (!title) return;

    const subtaskInputs = document.querySelectorAll('#subtasksForm .subtask-input');
    const subtasks = [];
    subtaskInputs.forEach(inp => {
      const t = inp.value.trim();
      if (t) subtasks.push({ text: t, done: false });
    });

    const recurrence = document.getElementById('recurrence').value;
    let weekdays = [];
    let monthlyDay = null;

    if (recurrence === 'weekly') {
      document.querySelectorAll('.weekday.active').forEach(b => {
        weekdays.push(parseInt(b.dataset.day));
      });
    }
    if (recurrence === 'monthly') {
      monthlyDay = parseInt(document.getElementById('monthlyDay').value) || null;
    }

    const data = {
      title,
      category: document.getElementById('category').value.trim(),
      urgency: document.getElementById('urgency').value,
      dueDate: document.getElementById('dueDate').value || null,
      recurrence,
      weekdays,
      monthlyDay,
      subtasks
    };

    if (id) {
      const act = activities.find(a => a.id === id);
      if (act) Object.assign(act, data);
    } else {
      activities.push({
        id: crypto.randomUUID(),
        status: 'pending',
        progress: 0,
        createdAt: new Date().toISOString(),
        ...data
      });
    }

    save();
    closeModal();
    render();
  }

  // ========== CALENDAR ==========
  function switchView(view) {
    document.getElementById('boardView').classList.toggle('hidden', view !== 'board');
    document.getElementById('calendarView').classList.toggle('active', view === 'calendar');
    document.getElementById('btnBoard').classList.toggle('active', view === 'board');
    document.getElementById('btnCalendar').classList.toggle('active', view === 'calendar');
    if (view === 'calendar') renderCalendar();
  }

  function changeMonth(delta) {
    calendarDate.setMonth(calendarDate.getMonth() + delta);
    renderCalendar();
  }

  function goToToday() {
    calendarDate = new Date();
    renderCalendar();
  }

  function renderCalendar() {
    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();
    const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    document.getElementById('calMonthYear').textContent = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1);
    const startDay = firstDay.getDay();
    const daysInM = daysInMonth(year, month);
    const prevDays = daysInMonth(year, month - 1);

    const grid = document.getElementById('calendarGrid');
    const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    let html = dayNames.map(d => `<div class="cal-day-name">${d}</div>`).join('');

    const today = startOfToday();
    const totalCells = 42;

    for (let i = 0; i < totalCells; i++) {
      let dayNum, cellMonth, cellYear, other = false;

      if (i < startDay) {
        dayNum = prevDays - startDay + i + 1;
        cellMonth = month - 1;
        cellYear = year;
        if (cellMonth < 0) { cellMonth = 11; cellYear--; }
        other = true;
      } else if (i - startDay >= daysInM) {
        dayNum = i - startDay - daysInM + 1;
        cellMonth = month + 1;
        cellYear = year;
        if (cellMonth > 11) { cellMonth = 0; cellYear++; }
        other = true;
      } else {
        dayNum = i - startDay + 1;
        cellMonth = month;
        cellYear = year;
      }

      const dateStr = `${cellYear}-${String(cellMonth + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
      const cellDate = new Date(cellYear, cellMonth, dayNum);
      const isToday = cellDate.getTime() === today.getTime();

      const dayActivities = activities.filter(a => a.dueDate === dateStr);

      html += `<div class="cal-day ${other ? 'other-month' : ''} ${isToday ? 'today' : ''}">
        <div class="cal-date">${dayNum}</div>
        ${dayActivities.map(a => {
          let cls = a.status;
          if (a.dueDate && a.status !== 'completed' && new Date(a.dueDate) < today) cls = 'overdue';
          return `<div class="cal-event ${cls}" title="${esc(a.title)}" onclick="editActivity('${a.id}')">${esc(a.title)}</div>`;
        }).join('')}
      </div>`;
    }

    grid.innerHTML = html;
  }

  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === document.getElementById('modal')) closeModal();
  });
</script>
</body>
</html>
