<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento — Actividades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Incremento global de texto: cada font-size = tamaño base + var(--bump) */
    --bump:1pt;

    --bg:#0F1013;
    --surface:#17181C;
    --surface-2:#1E2025;
    --surface-3:#272A31;
    --surface-4:#31343C;
    --border:#2C2F37;
    --border-soft:#212327;
    --border-strong:#40444E;

    --text:#F3F1EC;
    --text-secondary:#C2C4CB;
    --text-dim:#9A9DA6;
    --text-faint:#7B7E88;

    --accent:#8388F0;
    --accent-strong:#9BA0F7;
    --accent-soft:rgba(131,136,240,0.16);
    --accent-border:rgba(131,136,240,0.4);

    --warm:#E7AC55;
    --warm-strong:#F2BE72;
    --warm-soft:rgba(231,172,85,0.16);
    --warm-border:rgba(231,172,85,0.45);

    --danger:#EA6E5F;
    --danger-strong:#FF8672;
    --danger-soft:rgba(234,110,95,0.15);
    --danger-border:rgba(234,110,95,0.55);

    --success:#78C39C;
    --success-strong:#8FDBB2;
    --success-soft:rgba(120,195,156,0.15);
    --success-border:rgba(120,195,156,0.4);

    --radius:10px;
    --font:'Barlow Condensed', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--text); font-family:var(--font); height:100%; }
  body{ min-height:100vh; display:flex; flex-direction:column; font-size:calc(15px + var(--bump)); }

  button, input, select, textarea{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent-strong); outline-offset:2px; }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 32px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .brand h1{ font-weight:700; font-size:calc(25px + var(--bump)); letter-spacing:0.2px; }
  .brand .today{
    font-weight:500; font-size:calc(25px + var(--bump)); color:var(--accent-strong);
    text-transform:capitalize; letter-spacing:0.2px;
  }

  .header-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .view-toggle{ display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px; }
  .view-btn{
    background:none; border:none; color:var(--text-dim); font-weight:600;
    font-size:calc(14px + var(--bump)); padding:6px 14px; border-radius:6px; cursor:pointer; transition:background .12s ease, color .12s ease;
  }
  .view-btn.active{ background:var(--surface-4); color:var(--text); }
  .view-btn:hover:not(.active){ color:var(--text-secondary); }

  .btn-primary{
    background:var(--accent); color:#0F1013; border:none; border-radius:8px; padding:9px 16px;
    font-weight:700; font-size:calc(14.5px + var(--bump)); cursor:pointer;
    transition:filter .15s ease, transform .1s ease; white-space:nowrap;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:active{ transform:scale(0.98); }

  /* ---------- Filter bar ---------- */
  .filter-bar{
    display:flex; align-items:center; gap:14px; padding:14px 32px; border-bottom:1px solid var(--border-soft);
    flex-wrap:wrap;
  }
  .search{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px;
    font-size:calc(14.5px + var(--bump)); color:var(--text); width:260px; max-width:100%; transition:border-color .15s ease;
  }
  .search::placeholder{ color:var(--text-faint); }
  .search:focus{ outline:none; border-color:var(--accent); }

  .tag-list{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tag-chip{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:5px 12px 5px 10px; font-size:calc(13px + var(--bump)); font-weight:500; color:var(--text-dim); cursor:pointer;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .tag-chip .tag-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .tag-chip .tag-count{ font-size:calc(11.5px + var(--bump)); color:var(--text-faint); }
  .tag-chip:hover{ border-color:var(--border-strong); color:var(--text-secondary); }
  .tag-chip.active{ background:var(--surface-3); color:var(--text); border-color:var(--border-strong); }
  .tag-chip.tag-all{ font-weight:700; }
  .tag-chip.tag-all.active{ background:var(--accent-soft); border-color:var(--accent-border); color:var(--accent-strong); }

  /* ---------- Board ---------- */
  main{ flex:1; padding:24px 32px 40px; overflow-x:auto; }
  .board{ display:grid; grid-template-columns:repeat(3, minmax(300px, 1fr)); gap:20px; min-width:960px; }
  .column{ display:flex; flex-direction:column; min-height:200px; }
  .column-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; }
  .column-title{ display:flex; align-items:center; gap:8px; font-size:calc(18px + var(--bump)); font-weight:600; color:var(--text); }
  .column-head-right{ display:flex; align-items:center; gap:8px; }
  .column-count{ font-size:calc(13px + var(--bump)); color:var(--text-faint); }
  .column-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot-todo{ background:var(--text-faint); }
  .dot-progress{ background:var(--warm); }
  .dot-done{ background:var(--success); }

  .clear-btn{
    background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:calc(12.5px + var(--bump));
    padding:2px 6px; border-radius:5px; transition:color .12s ease, background .12s ease;
  }
  .clear-btn:hover{ color:var(--danger-strong); background:var(--danger-soft); }

  .flow-bar{ height:2px; background:var(--border-soft); border-radius:2px; margin-bottom:14px; overflow:hidden; }
  .flow-bar-fill{ height:100%; transition:width .25s ease; }
  .fill-todo{ background:var(--text-faint); }
  .fill-progress{ background:var(--warm); }
  .fill-done{ background:var(--success); }

  .drop-zone{ flex:1; display:flex; flex-direction:column; gap:10px; min-height:120px; border-radius:var(--radius); padding:2px; transition:background .15s ease; }
  .drop-zone.drag-over{ background:var(--surface-2); outline:1px dashed var(--border-strong); }

  .empty-state{ border:1px dashed var(--border-soft); border-radius:var(--radius); padding:24px 14px; text-align:center; color:var(--text-faint); font-size:calc(13.5px + var(--bump)); line-height:1.5; }

  /* ---------- Card ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border-strong);
    border-radius:var(--radius); padding:14px 14px 12px; cursor:grab; position:relative;
    transition:border-color .15s ease, transform .1s ease, background .15s ease;
  }
  .card:hover{ border-color:#3a3e47; }
  .card.dragging{ opacity:0.4; }

  .card.card-moved{ animation:cardMoveIn 0.32s ease; }
  @keyframes cardMoveIn{
    0%{ opacity:0; transform:translateY(-8px) scale(0.96); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .card.urgency-overdue{ border-left-color:var(--danger); background:linear-gradient(180deg, var(--danger-soft), var(--surface) 55%); }
  .card.urgency-soon{ border-left-color:var(--warm); }
  .card.urgency-done{ border-left-color:var(--success); }

  .pulse-dot{
    position:absolute; top:12px; right:12px; width:7px; height:7px; border-radius:50%; background:var(--danger-strong);
    box-shadow:0 0 0 0 rgba(234,110,95,0.6); animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(234,110,95,0.55); }
    70%{ box-shadow:0 0 0 7px rgba(234,110,95,0); }
    100%{ box-shadow:0 0 0 0 rgba(234,110,95,0); }
  }

  .card-top{ display:flex; align-items:flex-start; gap:8px; margin-bottom:6px; padding-right:16px; }
  .priority-mark{ font-weight:700; font-size:calc(15px + var(--bump)); line-height:1; margin-top:2px; flex-shrink:0; width:12px; text-align:center; }
  .priority-alta{ color:var(--warm-strong); }
  .priority-media{ color:var(--text-secondary); }
  .priority-baja{ color:var(--text-faint); }

  .card-title{ font-weight:600; font-size:calc(16.5px + var(--bump)); line-height:1.25; flex:1; color:var(--text); overflow-wrap:anywhere; }
  .card.done .card-title{ color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--border-strong); }

  .card-actions{ display:flex; align-items:center; gap:4px; opacity:0; transition:opacity .12s ease; flex-shrink:0; }
  .card:hover .card-actions, .card:focus-within .card-actions{ opacity:1; }
  .icon-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:calc(14px + var(--bump)); padding:2px 4px; line-height:1; border-radius:4px; }
  .icon-btn:hover{ color:var(--text); background:var(--surface-3); }

  /* Movimiento entre columnas: alternativa al drag & drop, imprescindible en táctil */
  .move-controls{ display:flex; gap:2px; margin-right:2px; }
  .move-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim); cursor:pointer; font-size:calc(13px + var(--bump));
    width:26px; height:26px; line-height:1; border-radius:5px; display:flex; align-items:center; justify-content:center;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .move-btn:hover{ border-color:var(--border-strong); color:var(--text); background:var(--surface-3); }
  .move-btn:disabled{ opacity:0; pointer-events:none; }

  /* En pantallas táctiles no hay :hover, así que las acciones deben quedar siempre visibles */
  @media (hover:none){
    .card-actions{ opacity:1; }
  }

  .card-desc{ font-size:calc(14.5px + var(--bump)); color:var(--text-secondary); line-height:1.5; margin:6px 0 10px 20px; overflow-wrap:anywhere; }

  .card-tags{ display:flex; align-items:center; gap:6px; margin-left:20px; flex-wrap:wrap; }

  .category-tag{ font-weight:600; font-size:calc(13.5px + var(--bump)); text-transform:uppercase; letter-spacing:0.03em; padding:4px 11px; border-radius:20px; border:1px solid transparent; }

  .status-tag{
    font-weight:800; font-size:calc(13.5px + var(--bump)); text-transform:uppercase; letter-spacing:0.03em;
    padding:4px 11px; border-radius:20px; border:1px solid transparent;
  }
  .status-tag.due-ok{ color:var(--text); background:var(--surface-2); border-color:var(--border); }
  .status-tag.due-soon{ color:var(--warm-strong); background:var(--warm-soft); border-color:var(--warm-border); box-shadow:0 0 0 1px rgba(231,172,85,0.12); }
  .status-tag.due-overdue{ color:var(--danger-strong); background:var(--danger-soft); border-color:var(--danger-border); box-shadow:0 0 0 1px rgba(234,110,95,0.15); }
  .status-tag.due-done{ color:var(--success-strong); background:var(--success-soft); border-color:var(--success-border); }
  .status-tag.due-none{ color:var(--text-dim); background:var(--surface-2); border-color:var(--border-soft); }

  .recurrence-tag{ font-weight:600; font-size:calc(13.5px + var(--bump)); color:var(--text-dim); background:var(--surface-2); padding:4px 11px; border-radius:20px; display:flex; align-items:center; gap:4px; }

  .due-corner{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; margin-left:8px; }
  .due-badge{
    font-weight:700; font-size:calc(13.5px + var(--bump)); white-space:nowrap;
    padding:4px 11px; border-radius:20px; border:1px solid transparent;
  }
  .due-badge.due-ok{ color:var(--text); background:var(--surface-2); border-color:var(--border); }
  .due-badge.due-soon{ color:var(--warm-strong); background:var(--warm-soft); border-color:var(--warm-border); }
  .due-badge.due-overdue{ color:var(--danger-strong); background:var(--danger-soft); border-color:var(--danger-border); }
  .due-badge.due-done{ color:var(--success-strong); background:var(--success-soft); border-color:var(--success-border); }
  .due-badge.due-none{ color:var(--text-dim); background:var(--surface-2); border-color:var(--border-soft); }

  .reschedule-btn{
    background:none; border:1px solid var(--danger-border); color:var(--danger-strong);
    font-weight:600; font-size:calc(12px + var(--bump)); padding:4px 10px; border-radius:7px; cursor:pointer; transition:background .12s ease;
  }
  .reschedule-btn:hover{ background:var(--danger-soft); }

  .reschedule-row{ display:flex; align-items:center; gap:6px; margin:2px 0 8px 20px; flex-wrap:wrap; }
  .reschedule-row input[type="date"]{
    background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:5px 7px;
    color:var(--text); font-size:calc(13px + var(--bump)); flex:1; min-width:140px;
  }
  .btn-mini{
    font-weight:600; font-size:calc(12px + var(--bump)); padding:5px 10px; border-radius:6px; cursor:pointer; border:none;
  }
  .btn-mini.save{ background:var(--accent); color:#0F1013; }
  .btn-mini.ghost{ background:none; border:1px solid var(--border); color:var(--text-dim); }

  .progress-meter{ display:flex; align-items:center; gap:10px; margin:10px 0 0 20px; }
  .progress-track{ flex:1; height:8px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:6px; overflow:hidden; }
  .progress-fill{
    position:relative; overflow:hidden; height:100%; width:0; border-radius:6px; background:var(--warm);
    transition:width .8s cubic-bezier(.22,.8,.3,1), background-color .3s ease;
  }
  .progress-fill.fill-complete{ background:var(--success); }
  .progress-fill::after{
    content:''; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation:shimmer 2.2s ease-in-out infinite;
  }
  .progress-fill.fill-complete::after{ display:none; }
  @keyframes shimmer{ to{ transform:translateX(100%); } }
  .progress-pct{
    min-width:46px; text-align:right; font-weight:700; font-size:calc(13px + var(--bump));
    color:var(--text-secondary); font-variant-numeric:tabular-nums;
  }
  .progress-pct.pct-complete{ color:var(--success-strong); }

  .progress-buttons{ display:flex; gap:4px; margin:8px 0 0 20px; }
  .progress-btn{
    flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text-faint);
    font-weight:600; font-size:calc(12px + var(--bump)); padding:5px 0; border-radius:6px; cursor:pointer;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .progress-btn:hover{ border-color:var(--border-strong); color:var(--text-secondary); }
  .progress-btn.active{ background:var(--accent-soft); border-color:var(--accent-border); color:var(--accent-strong); font-weight:700; }

  /* ---------- Checklist ---------- */
  .checklist{ display:flex; flex-direction:column; gap:5px; margin:6px 0 10px 20px; }
  .checklist-item{ display:flex; align-items:flex-start; gap:8px; font-size:calc(13px + var(--bump)); color:var(--text-dim); cursor:pointer; }
  .checklist-item input[type="checkbox"]{
    appearance:none; -webkit-appearance:none; width:17px; height:17px; margin-top:1px; border:1.5px solid var(--border-strong);
    border-radius:4px; cursor:pointer; flex-shrink:0; position:relative; background:var(--surface-2);
  }
  .checklist-item input[type="checkbox"]:checked{ background:var(--accent); border-color:var(--accent); }
  .checklist-item input[type="checkbox"]:checked::after{
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:calc(10.5px + var(--bump)); color:#0F1013; font-weight:700;
  }
  .checklist-item span{ flex:1; line-height:1.35; overflow-wrap:anywhere; }
  .checklist-item.done span{ text-decoration:line-through; color:var(--text-faint); }

  /* ---------- Calendar ---------- */
  .calendar{ display:flex; flex-direction:column; gap:14px; }
  .cal-nav{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .cal-nav-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text-secondary); width:34px; height:34px;
    border-radius:8px; cursor:pointer; font-size:calc(16px + var(--bump)); line-height:1; transition:border-color .12s ease, color .12s ease;
  }
  .cal-nav-btn:hover{ border-color:var(--border-strong); color:var(--text); }
  .cal-label{ font-size:calc(19px + var(--bump)); font-weight:600; text-transform:capitalize; min-width:180px; }

  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
  .cal-weekdays span{ font-weight:600; font-size:calc(12px + var(--bump)); color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; text-align:center; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
  .cal-cell{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:9px; min-height:110px;
    padding:8px; display:flex; flex-direction:column; gap:5px; min-width:0;
  }
  .cal-cell.other-month{ opacity:0.4; }
  .cal-cell.is-today{ border-color:var(--accent-border); background:var(--accent-soft); }
  .cal-daynum{ font-size:calc(13px + var(--bump)); color:var(--text-dim); align-self:flex-end; }
  .cal-cell.is-today .cal-daynum{ color:var(--accent-strong); font-weight:700; }

  .cal-event{
    display:flex; align-items:center; gap:5px; font-size:calc(12px + var(--bump)); color:var(--text-secondary); background:var(--surface-2);
    border-radius:5px; padding:3px 6px; cursor:pointer; overflow:hidden; white-space:nowrap;
    transition:background .12s ease;
  }
  .cal-event > span:last-child{ overflow:hidden; text-overflow:ellipsis; }
  .cal-event:hover{ background:var(--surface-3); }
  .cal-event .cal-event-dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .cal-event.is-overdue{ color:var(--danger-strong); font-weight:600; }
  .cal-event.is-soon{ color:var(--warm-strong); font-weight:600; }
  .cal-event.is-done{ color:var(--text-faint); text-decoration:line-through; }
  .cal-more{ font-size:calc(11.5px + var(--bump)); color:var(--text-faint); padding-left:2px; }

  /* ---------- Categorías predefinidas ---------- */
  .preset-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .preset-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .preset-chip{
    display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:5px 12px 5px 10px; font-size:calc(13px + var(--bump)); font-weight:500;
    color:var(--text-dim); cursor:pointer; transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .preset-chip:hover{ border-color:var(--border-strong); color:var(--text-secondary); }
  .preset-chip.selected{ background:var(--accent-soft); border-color:var(--accent-border); color:var(--text); }
  .preset-empty{ font-size:calc(13px + var(--bump)); color:var(--text-faint); line-height:1.4; }
  .preset-manage-list{ display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; }
  .preset-manage-item{
    display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:7px; padding:7px 10px; font-size:calc(14px + var(--bump)); color:var(--text);
  }
  .preset-manage-item .preset-dot{ width:10px; height:10px; }
  .preset-manage-item .name{ flex:1; overflow-wrap:anywhere; }
  .preset-manage-item button{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:calc(13px + var(--bump)); padding:2px 6px; border-radius:4px; line-height:1; }
  .preset-manage-item button:hover{ color:var(--danger-strong); background:var(--danger-soft); }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(6,7,9,0.65); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:460px; padding:24px; max-height:90vh; overflow-y:auto; }
  .modal h2{ font-weight:700; font-size:calc(21px + var(--bump)); margin-bottom:18px; }

  .field{ margin-bottom:14px; }
  .field label, .field .field-label{ display:block; font-size:calc(12px + var(--bump)); font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); margin-bottom:6px; }
  .field input[type="text"], .field textarea, .field select, .field input[type="date"]{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 10px;
    color:var(--text); font-size:calc(15px + var(--bump));
  }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; min-width:0; }

  .color-select{ display:flex; gap:9px; flex-wrap:wrap; padding-top:2px; }
  .color-swatch{
    width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent;
    position:relative; transition:transform .1s ease, border-color .12s ease; flex-shrink:0;
  }
  .color-swatch:hover{ transform:scale(1.08); }
  .color-swatch.selected{ border-color:var(--text); box-shadow:0 0 0 2px var(--surface); }
  .color-swatch.selected::after{
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:calc(12px + var(--bump)); font-weight:700; color:#0F1013;
  }

  .priority-select{ display:flex; gap:8px; }
  .priority-option{
    flex:1; text-align:center; padding:8px 4px; border:1px solid var(--border); border-radius:8px; font-size:calc(13.5px + var(--bump));
    cursor:pointer; color:var(--text-dim); font-weight:500; transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .priority-option.selected{ border-color:var(--accent-border); color:var(--text); background:var(--accent-soft); }

  .weekday-select{ display:flex; gap:6px; }
  .weekday-option{
    flex:1; text-align:center; padding:8px 0; border:1px solid var(--border); border-radius:8px; font-size:calc(13px + var(--bump));
    cursor:pointer; color:var(--text-dim); font-weight:700; transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .weekday-option.selected{ border-color:var(--accent-border); color:var(--text); background:var(--accent-soft); }

  .checklist-builder{ display:flex; flex-direction:column; gap:8px; }
  .checklist-add-row{ display:flex; gap:6px; }
  .checklist-add-row input{ flex:1; }
  .checklist-draft-list{ display:flex; flex-direction:column; gap:6px; max-height:150px; overflow-y:auto; }
  .checklist-draft-item{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:7px; padding:6px 9px; font-size:calc(13.5px + var(--bump)); color:var(--text);
  }
  .checklist-draft-item span{ flex:1; overflow-wrap:anywhere; }
  .checklist-draft-item button{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:calc(13px + var(--bump)); padding:2px; line-height:1; }
  .checklist-draft-item button:hover{ color:var(--danger-strong); }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .btn-ghost{ background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:9px 16px; font-size:calc(14.5px + var(--bump)); cursor:pointer; font-weight:500; }
  .btn-ghost:hover{ color:var(--text); border-color:var(--border-strong); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--surface-4);
    border:1px solid var(--border-strong); color:var(--text); padding:10px 18px; border-radius:8px; font-size:calc(13.5px + var(--bump));
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:60; max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:820px){
    .board{ grid-template-columns:1fr; min-width:0; }
    main{ padding:18px; }
    header{ padding:16px 18px; }
    .filter-bar{ padding:12px 18px; }
    .cal-cell{ min-height:76px; padding:6px; }
    .cal-event{ padding:2px 4px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Seguimiento</h1>
    <span class="today" id="todayLabel"></span>
  </div>
  <div class="header-actions">
    <div class="view-toggle" role="group" aria-label="Vista">
      <button type="button" class="view-btn active" data-view="board" aria-pressed="true">Tablero</button>
      <button type="button" class="view-btn" data-view="calendar" aria-pressed="false">Calendario</button>
    </div>
    <button type="button" class="btn-ghost" id="exportBtn" title="Descargar copia de seguridad en JSON">Exportar</button>
    <button type="button" class="btn-ghost" id="importBtn" title="Cargar actividades desde un archivo JSON">Importar</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button type="button" class="btn-ghost" id="manageCatsBtn" title="Crear y administrar categorías predefinidas">Categorías</button>
    <button type="button" class="btn-primary" id="openModalBtn">+ Nueva actividad</button>
  </div>
</header>

<div class="filter-bar">
  <input type="search" class="search" id="searchInput" placeholder="Buscar actividad…" aria-label="Buscar actividad">
  <div class="tag-list" id="tagList" role="group" aria-label="Filtrar por categoría"></div>
</div>

<main>
  <div class="board" id="boardView">
    <div class="column" data-status="todo">
      <div class="column-head">
        <div class="column-title"><span class="column-dot dot-todo"></span>Pendiente</div>
        <div class="column-head-right"><span class="column-count" id="count-todo">0</span></div>
      </div>
      <div class="flow-bar"><div class="flow-bar-fill fill-todo" id="flow-todo" style="width:0%"></div></div>
      <div class="drop-zone" id="zone-todo" data-status="todo"></div>
    </div>

    <div class="column" data-status="progress">
      <div class="column-head">
        <div class="column-title"><span class="column-dot dot-progress"></span>En progreso</div>
        <div class="column-head-right"><span class="column-count" id="count-progress">0</span></div>
      </div>
      <div class="flow-bar"><div class="flow-bar-fill fill-progress" id="flow-progress" style="width:0%"></div></div>
      <div class="drop-zone" id="zone-progress" data-status="progress"></div>
    </div>

    <div class="column" data-status="done">
      <div class="column-head">
        <div class="column-title"><span class="column-dot dot-done"></span>Completado</div>
        <div class="column-head-right">
          <span class="column-count" id="count-done">0</span>
          <button type="button" class="clear-btn" id="clearDoneBtn" title="Vaciar completados">Limpiar</button>
        </div>
      </div>
      <div class="flow-bar"><div class="flow-bar-fill fill-done" id="flow-done" style="width:0%"></div></div>
      <div class="drop-zone" id="zone-done" data-status="done"></div>
    </div>
  </div>

  <div class="calendar" id="calendarView" style="display:none">
    <div class="cal-nav">
      <button type="button" class="cal-nav-btn" id="calPrev" aria-label="Mes anterior">‹</button>
      <span class="cal-label" id="calLabel" aria-live="polite"></span>
      <button type="button" class="cal-nav-btn" id="calNext" aria-label="Mes siguiente">›</button>
      <button type="button" class="btn-ghost" id="calToday">Hoy</button>
    </div>
    <div class="cal-weekdays">
      <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
    </div>
    <div class="cal-grid" id="calendarGrid"></div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Nueva actividad</h2>
    <form id="activityForm">
      <div class="field">
        <label for="f-title">Título</label>
        <input type="text" id="f-title" required maxlength="80" placeholder="Ej. Terminar informe mensual">
      </div>
      <div class="field">
        <label for="f-desc">Descripción (opcional)</label>
        <textarea id="f-desc" maxlength="200" placeholder="Detalles o notas breves…"></textarea>
      </div>
      <div class="field">
        <label for="f-checklist-input">Lista de tareas (opcional)</label>
        <div class="checklist-builder">
          <div class="checklist-add-row">
            <input type="text" id="f-checklist-input" maxlength="80" placeholder="Ej. Reunir los materiales">
            <button type="button" class="btn-mini save" id="checklistAddBtn">Agregar</button>
          </div>
          <div class="checklist-draft-list" id="checklistDraftList"></div>
        </div>
      </div>
      <div class="field">
        <span class="field-label" id="presetLabel">Categorías predefinidas</span>
        <div class="preset-chips" id="presetChips" role="group" aria-labelledby="presetLabel"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-category">Categoría</label>
          <input type="text" id="f-category" maxlength="20" placeholder="Ej. Trabajo" list="categoryList">
          <datalist id="categoryList"></datalist>
        </div>
        <div class="field">
          <label for="f-due">Fecha límite</label>
          <input type="date" id="f-due">
        </div>
      </div>
      <div class="field">
        <span class="field-label" id="colorSelectLabel">Color de la etiqueta</span>
        <div class="color-select" id="colorSelect" role="group" aria-labelledby="colorSelectLabel"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <span class="field-label" id="prioritySelectLabel">Prioridad</span>
          <div class="priority-select" id="prioritySelect" role="group" aria-labelledby="prioritySelectLabel">
            <div class="priority-option" data-value="baja" tabindex="0" role="button" aria-pressed="false">– Baja</div>
            <div class="priority-option selected" data-value="media" tabindex="0" role="button" aria-pressed="true">● Media</div>
            <div class="priority-option" data-value="alta" tabindex="0" role="button" aria-pressed="false">◆ Alta</div>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="f-recurrence">Repetir</label>
        <select id="f-recurrence">
          <option value="none">No se repite</option>
          <option value="weekly">Semanalmente</option>
          <option value="monthly">Mensualmente</option>
        </select>
      </div>
      <div class="field" id="weeklyDaysField" style="display:none">
        <span class="field-label" id="weekdaySelectLabel">Días de la semana</span>
        <div class="weekday-select" id="weekdaySelect" role="group" aria-labelledby="weekdaySelectLabel">
          <div class="weekday-option" data-value="1" tabindex="0" role="button" aria-pressed="false" aria-label="Lunes">L</div>
          <div class="weekday-option" data-value="2" tabindex="0" role="button" aria-pressed="false" aria-label="Martes">M</div>
          <div class="weekday-option" data-value="3" tabindex="0" role="button" aria-pressed="false" aria-label="Miércoles">X</div>
          <div class="weekday-option" data-value="4" tabindex="0" role="button" aria-pressed="false" aria-label="Jueves">J</div>
          <div class="weekday-option" data-value="5" tabindex="0" role="button" aria-pressed="false" aria-label="Viernes">V</div>
          <div class="weekday-option" data-value="6" tabindex="0" role="button" aria-pressed="false" aria-label="Sábado">S</div>
          <div class="weekday-option" data-value="7" tabindex="0" role="button" aria-pressed="false" aria-label="Domingo">D</div>
        </div>
      </div>
      <div class="field" id="monthlyDayField" style="display:none">
        <label for="f-monthday">Día del mes</label>
        <select id="f-monthday"></select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn-primary" id="saveBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="catOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="catModalTitle">
    <h2 id="catModalTitle">Categorías predefinidas</h2>
    <form id="catForm">
      <div class="field">
        <label for="c-name">Nueva categoría</label>
        <input type="text" id="c-name" maxlength="20" required placeholder="Ej. Estudio">
      </div>
      <div class="field">
        <span class="field-label" id="catColorLabel">Color</span>
        <div class="color-select" id="catColorSelect" role="group" aria-labelledby="catColorLabel"></div>
      </div>
      <button type="submit" class="btn-primary">Añadir categoría</button>
    </form>
    <div class="field" style="margin-top:20px">
      <span class="field-label">Categorías guardadas</span>
      <div class="preset-manage-list" id="presetManageList"></div>
    </div>
    <div class="modal-actions"><button type="button" class="btn-ghost" id="catCloseBtn">Cerrar</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'seguimiento_actividades_v1';
  const PRESETS_KEY = 'seguimiento_categorias_v1';
  const STATUS_ORDER = ['todo','progress','done'];
  const PRIORITIES = ['alta','media','baja'];
  const PROGRESS_STEPS = [0,25,50,75,100];
  const ID_RE = /^[\w-]{1,64}$/;
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const LOCALE = 'es-ES';

  let activities = [];
  let presets = [];
  let editingId = null;
  let draggingId = null;
  let justMovedId = null;
  let currentView = 'board';
  let calState = startOfMonth(new Date());
  let lastFocused = null;
  const activeCategories = new Set();
  const reschedulingIds = new Set();

  const priorityGlyph = { alta:'◆', media:'●', baja:'–' };
  const priorityClass = { alta:'priority-alta', media:'priority-media', baja:'priority-baja' };
  const recurrenceLabel = { weekly:'Semanal', monthly:'Mensual' };
  const weekdayAbbrev = { 1:'L', 2:'M', 3:'X', 4:'J', 5:'V', 6:'S', 7:'D' };

  const categoryPalette = [
    { name:'Índigo', dot:'#818CF8', bg:'rgba(129,140,248,0.15)', text:'#ADB4FA', border:'rgba(129,140,248,0.4)' },
    { name:'Esmeralda', dot:'#34D399', bg:'rgba(52,211,153,0.15)', text:'#7BE2BD', border:'rgba(52,211,153,0.4)' },
    { name:'Rosa', dot:'#F472B6', bg:'rgba(244,114,182,0.15)', text:'#F8A3D0', border:'rgba(244,114,182,0.4)' },
    { name:'Ámbar', dot:'#FBBF24', bg:'rgba(251,191,36,0.15)', text:'#FCD571', border:'rgba(251,191,36,0.4)' },
    { name:'Cian', dot:'#22D3EE', bg:'rgba(34,211,238,0.15)', text:'#6FE2F4', border:'rgba(34,211,238,0.4)' },
    { name:'Violeta', dot:'#A78BFA', bg:'rgba(167,139,250,0.15)', text:'#C6B4FC', border:'rgba(167,139,250,0.4)' },
    { name:'Lima', dot:'#A3E635', bg:'rgba(163,230,53,0.15)', text:'#C3EF7C', border:'rgba(163,230,53,0.4)' },
    { name:'Coral', dot:'#FB7185', bg:'rgba(251,113,133,0.15)', text:'#FCA3B0', border:'rgba(251,113,133,0.4)' },
    { name:'Naranja', dot:'#FB923C', bg:'rgba(251,146,60,0.15)', text:'#FCB880', border:'rgba(251,146,60,0.4)' },
    { name:'Turquesa', dot:'#2DD4BF', bg:'rgba(45,212,191,0.15)', text:'#76E3D5', border:'rgba(45,212,191,0.4)' },
    { name:'Azul', dot:'#60A5FA', bg:'rgba(96,165,250,0.15)', text:'#98C4FC', border:'rgba(96,165,250,0.4)' },
    { name:'Fucsia', dot:'#E879F9', bg:'rgba(232,121,249,0.15)', text:'#F0A8FB', border:'rgba(232,121,249,0.4)' }
  ];

  const $ = (id) => document.getElementById(id);
  const overlay = $('overlay');
  const form = $('activityForm');
  const prioritySelect = $('prioritySelect');
  const colorSelect = $('colorSelect');
  const toastEl = $('toast');
  const searchInput = $('searchInput');
  const checklistInput = $('f-checklist-input');
  const checklistDraftList = $('checklistDraftList');
  const recurrenceSelect = $('f-recurrence');
  const weeklyDaysField = $('weeklyDaysField');
  const monthlyDayField = $('monthlyDayField');
  const weekdaySelect = $('weekdaySelect');
  const monthdaySelect = $('f-monthday');
  let selectedColorIndex = 0;
  let checklistDraft = [];
  let selectedWeekdays = new Set();

  /* ---------- Utilidades ---------- */
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }

  function uid(){ return 'a_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function isoDate(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }

  function parseISO(str){ return new Date(str + 'T00:00:00'); }

  function isValidISODate(str){
    if(typeof str !== 'string' || !DATE_RE.test(str)) return false;
    return !isNaN(parseISO(str).getTime());
  }

  function formatShort(dueStr){
    return parseISO(dueStr).toLocaleDateString(LOCALE, { day:'numeric', month:'short' });
  }

  function categoryKey(name){ return name && name.trim() ? name.trim() : 'Sin categoría'; }

  function categoryColor(name){
    const key = categoryKey(name);
    let hash = 0;
    for(let i=0;i<key.length;i++){ hash = (hash * 31 + key.charCodeAt(i)) >>> 0; }
    return categoryPalette[hash % categoryPalette.length];
  }

  function categoryColorFor(a){
    if(a && Number.isInteger(a.colorIndex) && categoryPalette[a.colorIndex]) return categoryPalette[a.colorIndex];
    return categoryColor(a ? a.category : '');
  }

  function cloneChecklist(checklist){
    return (checklist || []).map(it => ({ id:uid(), text:it.text, done:false }));
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2400);
  }

  function enableKeyboardActivation(container, itemSelector){
    container.addEventListener('keydown', (e) => {
      if(e.key !== 'Enter' && e.key !== ' ') return;
      const item = e.target.closest(itemSelector);
      if(!item) return;
      e.preventDefault();
      item.click();
    });
  }

  /* ---------- Inicialización de controles ---------- */
  for(let i = 1; i <= 31; i++){
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i;
    monthdaySelect.appendChild(opt);
  }

  $('todayLabel').textContent = new Date().toLocaleDateString(LOCALE, { weekday:'long', day:'numeric', month:'long' });

  function buildColorSwatches(){
    colorSelect.innerHTML = '';
    categoryPalette.forEach((color, i) => {
      const sw = document.createElement('div');
      sw.className = 'color-swatch';
      sw.style.background = color.dot;
      sw.dataset.index = i;
      sw.title = color.name;
      sw.tabIndex = 0;
      sw.setAttribute('role', 'button');
      sw.setAttribute('aria-label', color.name);
      sw.setAttribute('aria-pressed', 'false');
      colorSelect.appendChild(sw);
    });
  }

  function setColorIndex(i){
    selectedColorIndex = i;
    [...colorSelect.children].forEach(el => {
      const on = parseInt(el.dataset.index, 10) === i;
      el.classList.toggle('selected', on);
      el.setAttribute('aria-pressed', String(on));
    });
  }

  buildColorSwatches();
  colorSelect.addEventListener('click', (e) => {
    const sw = e.target.closest('.color-swatch');
    if(!sw) return;
    setColorIndex(parseInt(sw.dataset.index, 10));
  });
  enableKeyboardActivation(colorSelect, '.color-swatch');

  function renderChecklistDraft(){
    checklistDraftList.innerHTML = '';
    checklistDraft.forEach(item => {
      const row = document.createElement('div');
      row.className = 'checklist-draft-item';
      const label = document.createElement('span');
      label.textContent = item.text;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.title = 'Quitar';
      btn.setAttribute('aria-label', 'Quitar: ' + item.text);
      btn.textContent = '✕';
      btn.addEventListener('click', () => {
        checklistDraft = checklistDraft.filter(x => x.id !== item.id);
        renderChecklistDraft();
      });
      row.append(label, btn);
      checklistDraftList.appendChild(row);
    });
  }

  function addChecklistDraftItem(){
    const text = checklistInput.value.trim();
    if(!text) return;
    checklistDraft.push({ id:uid(), text, done:false });
    checklistInput.value = '';
    renderChecklistDraft();
    checklistInput.focus();
  }

  $('checklistAddBtn').addEventListener('click', addChecklistDraftItem);
  checklistInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); addChecklistDraftItem(); }
  });

  function setWeekdays(days){
    selectedWeekdays = new Set(days || []);
    [...weekdaySelect.children].forEach(el => {
      const on = selectedWeekdays.has(parseInt(el.dataset.value, 10));
      el.classList.toggle('selected', on);
      el.setAttribute('aria-pressed', String(on));
    });
  }

  weekdaySelect.addEventListener('click', (e) => {
    const opt = e.target.closest('.weekday-option');
    if(!opt) return;
    const v = parseInt(opt.dataset.value, 10);
    if(selectedWeekdays.has(v)) selectedWeekdays.delete(v); else selectedWeekdays.add(v);
    const on = selectedWeekdays.has(v);
    opt.classList.toggle('selected', on);
    opt.setAttribute('aria-pressed', String(on));
  });
  enableKeyboardActivation(weekdaySelect, '.weekday-option');

  function toggleRecurrenceFields(){
    const val = recurrenceSelect.value;
    weeklyDaysField.style.display = val === 'weekly' ? 'block' : 'none';
    monthlyDayField.style.display = val === 'monthly' ? 'block' : 'none';
  }
  recurrenceSelect.addEventListener('change', toggleRecurrenceFields);

  function setPriority(value){
    [...prioritySelect.children].forEach(el => {
      const on = el.dataset.value === value;
      el.classList.toggle('selected', on);
      el.setAttribute('aria-pressed', String(on));
    });
  }

  prioritySelect.addEventListener('click', (e) => {
    const opt = e.target.closest('.priority-option');
    if(!opt) return;
    setPriority(opt.dataset.value);
  });
  enableKeyboardActivation(prioritySelect, '.priority-option');

  /* ---------- Validación de datos (almacenamiento e importación) ---------- */
  // Todo dato que viene de localStorage o de un archivo JSON se normaliza aquí,
  // de modo que nunca llegue al DOM un valor inesperado (ids, fechas, números…).
  function sanitizeList(list){
    if(!Array.isArray(list)) return null;
    const seenIds = new Set();
    const clean = [];
    for(const raw of list){
      if(!raw || typeof raw !== 'object') continue;
      const title = typeof raw.title === 'string' ? raw.title.trim().slice(0, 80) : '';
      if(!title) continue;

      let id = typeof raw.id === 'string' && ID_RE.test(raw.id) ? raw.id : uid();
      while(seenIds.has(id)) id = uid();
      seenIds.add(id);

      const status = STATUS_ORDER.includes(raw.status) ? raw.status : 'todo';
      let progress = Number.isFinite(raw.progress) ? Math.min(100, Math.max(0, Math.round(raw.progress / 25) * 25)) : 0;
      if(status === 'done') progress = 100;
      if(status === 'todo') progress = 0;

      const recurrence = ['weekly','monthly'].includes(raw.recurrence) ? raw.recurrence : 'none';
      const recurrenceDays = Array.isArray(raw.recurrenceDays)
        ? [...new Set(raw.recurrenceDays.filter(n => Number.isInteger(n) && n >= 1 && n <= 7))].sort((a,b) => a - b)
        : undefined;
      const recurrenceDayOfMonth = Number.isInteger(raw.recurrenceDayOfMonth) && raw.recurrenceDayOfMonth >= 1 && raw.recurrenceDayOfMonth <= 31
        ? raw.recurrenceDayOfMonth : undefined;

      const itemIds = new Set();
      const checklist = Array.isArray(raw.checklist) ? raw.checklist.map(it => {
        if(!it || typeof it.text !== 'string' || !it.text.trim()) return null;
        let itemId = typeof it.id === 'string' && ID_RE.test(it.id) ? it.id : uid();
        while(itemIds.has(itemId)) itemId = uid();
        itemIds.add(itemId);
        return { id:itemId, text:it.text.trim().slice(0, 80), done:!!it.done };
      }).filter(Boolean) : undefined;

      clean.push({
        id, title,
        desc: typeof raw.desc === 'string' ? raw.desc.slice(0, 200) : '',
        category: typeof raw.category === 'string' ? raw.category.trim().slice(0, 20) : '',
        due: isValidISODate(raw.due) ? raw.due : '',
        priority: PRIORITIES.includes(raw.priority) ? raw.priority : 'media',
        status, progress, recurrence, recurrenceDays, recurrenceDayOfMonth,
        colorIndex: Number.isInteger(raw.colorIndex) && categoryPalette[raw.colorIndex] ? raw.colorIndex : undefined,
        checklist,
        spawned: !!raw.spawned
      });
    }
    return clean;
  }

  /* ---------- Persistencia ---------- */
  function loadActivities(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? sanitizeList(JSON.parse(raw)) : null;
      if(parsed){
        activities = parsed;
      } else {
        activities = seedData();
        persist();
      }
    }catch(e){
      console.error('No se pudo leer el almacenamiento local', e);
      activities = seedData();
    }
    refresh();
  }

  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(activities));
    }catch(e){
      console.error('No se pudo guardar', e);
      showToast('No se pudo guardar localmente');
    }
  }

  /* ---------- Exportar / Importar ---------- */
  function exportActivities(){
    const blob = new Blob([JSON.stringify(activities, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'actividades-' + isoDate(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('Copia de seguridad descargada');
  }

  function importActivities(file){
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(e){
        showToast('El archivo no es un JSON válido');
        return;
      }
      const clean = sanitizeList(parsed);
      if(clean === null){
        showToast('El archivo no tiene el formato esperado');
        return;
      }
      if(clean.length === 0){
        showToast('No se encontraron actividades válidas en el archivo');
        return;
      }
      if(!confirm('Se reemplazará el tablero actual con ' + clean.length + ' actividad(es) del archivo. ¿Continuar?')) return;
      activities = clean;
      reschedulingIds.clear();
      persist();
      refresh();
      showToast('Actividades importadas');
    };
    reader.onerror = () => showToast('No se pudo leer el archivo');
    reader.readAsText(file);
  }

  $('exportBtn').addEventListener('click', exportActivities);
  const importFileInput = $('importFile');
  $('importBtn').addEventListener('click', () => importFileInput.click());
  importFileInput.addEventListener('change', () => {
    const file = importFileInput.files[0];
    if(file) importActivities(file);
    importFileInput.value = '';
  });

  function seedData(){
    const today = new Date();
    const plus = (n) => { const d = new Date(today); d.setDate(d.getDate()+n); return isoDate(d); };
    return [
      { id:uid(), title:'Definir alcance del proyecto', desc:'', category:'Trabajo', due:plus(-1), priority:'alta', status:'todo', progress:0, recurrence:'none',
        checklist:[
          { id:uid(), text:'Reunirse con el cliente', done:false },
          { id:uid(), text:'Documentar requisitos', done:false }
        ] },
      { id:uid(), title:'Leer 30 páginas', desc:'', category:'Personal', due:plus(3), priority:'media', status:'todo', progress:0, recurrence:'none' },
      { id:uid(), title:'Preparar presentación', desc:'Revisar cifras del trimestre', category:'Trabajo', due:plus(1), priority:'alta', status:'progress', progress:50, recurrence:'none',
        checklist:[
          { id:uid(), text:'Reunir cifras del trimestre', done:true },
          { id:uid(), text:'Diseñar diapositivas', done:false },
          { id:uid(), text:'Ensayar la exposición', done:false }
        ] },
      { id:uid(), title:'Rutina de ejercicio', desc:'', category:'Salud', due:plus(0), priority:'baja', status:'progress', progress:75, recurrence:'weekly', recurrenceDays:[1,3,5] },
      { id:uid(), title:'Configurar entorno de desarrollo', desc:'', category:'Trabajo', due:plus(-5), priority:'media', status:'done', progress:100, recurrence:'none' }
    ];
  }

  /* ---------- Lógica de fechas y urgencia ---------- */
  function daysUntil(dueStr){
    if(!dueStr) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    return Math.round((parseISO(dueStr) - today) / 86400000);
  }

  function urgencyOf(a){
    if(a.status === 'done') return 'done';
    const d = daysUntil(a.due);
    if(d === null) return 'none';
    if(d < 0) return 'overdue';
    if(d <= 2) return 'soon';
    return 'ok';
  }

  function urgencyLabel(u, d){
    if(u === 'done') return 'Completada';
    if(u === 'none') return 'Sin fecha';
    if(u === 'overdue') return 'Vencida';
    if(u === 'soon') return d === 0 ? 'Urgente · hoy' : 'Urgente';
    return 'A tiempo';
  }

  function matches(a){
    const q = searchInput.value.trim().toLowerCase();
    const textMatch = !q || a.title.toLowerCase().includes(q) || categoryKey(a.category).toLowerCase().includes(q) || (a.desc && a.desc.toLowerCase().includes(q));
    const catMatch = activeCategories.size === 0 || activeCategories.has(categoryKey(a.category));
    return textMatch && catMatch;
  }

  function sortByDue(list){
    return list.slice().sort((a,b) => {
      if(!a.due && !b.due) return 0;
      if(!a.due) return 1;
      if(!b.due) return -1;
      return a.due.localeCompare(b.due);
    });
  }

  /* ---------- Recurrencia ---------- */
  function isoWeekday(d){ return ((d.getDay() + 6) % 7) + 1; }

  function nextWeeklyDate(base, days){
    const set = days && days.length ? days : [isoWeekday(base)];
    for(let add = 1; add <= 14; add++){
      const cand = new Date(base);
      cand.setDate(cand.getDate() + add);
      if(set.includes(isoWeekday(cand))) return cand;
    }
    const fallback = new Date(base);
    fallback.setDate(fallback.getDate() + 7);
    return fallback;
  }

  function nextMonthlyDate(base, dayOfMonth){
    const dom = dayOfMonth || base.getDate();
    const next = new Date(base.getFullYear(), base.getMonth() + 1, 1);
    const daysInNextMonth = new Date(next.getFullYear(), next.getMonth() + 1, 0).getDate();
    next.setDate(Math.min(dom, daysInNextMonth));
    return next;
  }

  function recurrenceDetail(a){
    if(a.recurrence === 'weekly' && a.recurrenceDays && a.recurrenceDays.length){
      return [...a.recurrenceDays].sort((x,y) => x - y).map(d => weekdayAbbrev[d]).join('');
    }
    if(a.recurrence === 'monthly' && a.recurrenceDayOfMonth){
      return 'día ' + a.recurrenceDayOfMonth;
    }
    return '';
  }

  function spawnRecurrence(a){
    if(!a.recurrence || a.recurrence === 'none') return;
    // Evita duplicar la siguiente repetición si la actividad se completa más de una vez
    if(a.spawned) return;
    a.spawned = true;
    const base = a.due ? parseISO(a.due) : new Date();
    let next;
    if(a.recurrence === 'weekly') next = nextWeeklyDate(base, a.recurrenceDays);
    else next = nextMonthlyDate(base, a.recurrenceDayOfMonth);
    const nextIso = isoDate(next);
    activities.push({
      id:uid(), title:a.title, desc:a.desc, category:a.category, colorIndex:a.colorIndex,
      due:nextIso, priority:a.priority, status:'todo', progress:0, recurrence:a.recurrence,
      recurrenceDays:a.recurrenceDays, recurrenceDayOfMonth:a.recurrenceDayOfMonth,
      checklist:cloneChecklist(a.checklist), spawned:false
    });
    showToast('Completada. Próxima repetición: ' + formatShort(nextIso));
  }

  /* ---------- Renderizado ---------- */
  function refresh(){
    renderTagList();
    renderBoard();
    renderCalendar();
    refreshCategoryDatalist();
  }

  // Para acciones que no agregan/quitan categorías ni actividades (buscar, reagendar)
  function refreshFiltered(){
    renderBoard();
    renderCalendar();
  }

  function renderTagList(){
    const tagList = $('tagList');
    const counts = {};
    activities.forEach(a => { const k = categoryKey(a.category); counts[k] = (counts[k]||0) + 1; });
    // Si una categoría filtrada ya no existe, se descarta del filtro
    [...activeCategories].forEach(c => { if(!counts[c]) activeCategories.delete(c); });
    const cats = Object.keys(counts).sort((a,b) => a.localeCompare(b, LOCALE));

    tagList.innerHTML = '';

    const allChip = document.createElement('button');
    allChip.type = 'button';
    allChip.className = 'tag-chip tag-all' + (activeCategories.size === 0 ? ' active' : '');
    allChip.textContent = 'Todas';
    allChip.setAttribute('aria-pressed', String(activeCategories.size === 0));
    allChip.addEventListener('click', () => { activeCategories.clear(); refresh(); });
    tagList.appendChild(allChip);

    cats.forEach(cat => {
      const color = categoryColor(cat);
      const on = activeCategories.has(cat);
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'tag-chip' + (on ? ' active' : '');
      chip.setAttribute('aria-pressed', String(on));

      const dot = document.createElement('span');
      dot.className = 'tag-dot';
      dot.style.background = color.dot;
      const name = document.createElement('span');
      name.textContent = cat;
      const count = document.createElement('span');
      count.className = 'tag-count';
      count.textContent = counts[cat];
      chip.append(dot, name, count);

      chip.addEventListener('click', () => {
        if(activeCategories.has(cat)) activeCategories.delete(cat); else activeCategories.add(cat);
        refresh();
      });
      tagList.appendChild(chip);
    });
  }

  function refreshCategoryDatalist(){
    const dl = $('categoryList');
    const cats = [...new Set([...activities.map(a => categoryKey(a.category)), ...presets.map(p => p.name)])].sort((a,b) => a.localeCompare(b, LOCALE));
    dl.innerHTML = '';
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      dl.appendChild(opt);
    });
  }

  function renderBoard(){
    // Una sola pasada sobre 'activities' para agrupar por estado y contar totales
    const buckets = { todo:[], progress:[], done:[] };
    const totalCounts = { todo:0, progress:0, done:0 };
    for(const a of activities){
      if(totalCounts[a.status] !== undefined) totalCounts[a.status]++;
      if(buckets[a.status] && matches(a)) buckets[a.status].push(a);
    }

    const hasFilter = !!(searchInput.value.trim() || activeCategories.size);
    const total = activities.length || 1;

    STATUS_ORDER.forEach(status => {
      const zone = $('zone-' + status);
      const items = sortByDue(buckets[status]);
      zone.innerHTML = '';

      if(items.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = hasFilter ? 'Sin resultados.' : (status === 'done' ? 'Nada completado todavía.' : 'Arrastra actividades aquí.');
        zone.appendChild(empty);
      } else {
        const frag = document.createDocumentFragment();
        items.forEach(a => frag.appendChild(buildCard(a)));
        zone.appendChild(frag);
      }
      $('count-' + status).textContent = totalCounts[status];
      $('flow-' + status).style.width = Math.round((totalCounts[status] / total) * 100) + '%';
    });

    justMovedId = null;
  }

  function el(tag, className, text){
    const node = document.createElement(tag);
    if(className) node.className = className;
    if(text !== undefined) node.textContent = text;
    return node;
  }

  function actionButton(className, action, label, text, disabled){
    const b = el('button', className, text);
    b.type = 'button';
    b.dataset.action = action;
    b.title = label;
    b.setAttribute('aria-label', label);
    if(disabled) b.disabled = true;
    return b;
  }

  function buildCard(a){
    const card = el('div');
    const urgency = urgencyOf(a);
    const d = daysUntil(a.due);
    card.className = 'card' + (a.status === 'done' ? ' done' : '') + ' urgency-' + urgency + (a.id === justMovedId ? ' card-moved' : '');
    card.draggable = true;
    card.dataset.id = a.id;

    const catColor = categoryColorFor(a);
    const isRescheduling = reschedulingIds.has(a.id);
    const statusIdx = STATUS_ORDER.indexOf(a.status);

    if(urgency === 'overdue') card.appendChild(el('span', 'pulse-dot'));

    /* --- Fila superior --- */
    const top = el('div', 'card-top');
    top.appendChild(el('span', 'priority-mark ' + priorityClass[a.priority], priorityGlyph[a.priority]));
    top.appendChild(el('span', 'card-title', a.title));

    if(!isRescheduling){
      const corner = el('div', 'due-corner');
      corner.appendChild(el('span', 'due-badge due-' + urgency, a.due ? formatShort(a.due) : 'Sin fecha'));
      if(urgency === 'overdue') corner.appendChild(actionButton('reschedule-btn', 'reschedule', 'Reagendar actividad', 'Reagendar'));
      top.appendChild(corner);
    }

    const actions = el('div', 'card-actions');
    const move = el('div', 'move-controls');
    move.appendChild(actionButton('move-btn', 'move-prev', 'Mover a la columna anterior', '‹', statusIdx <= 0));
    move.appendChild(actionButton('move-btn', 'move-next', 'Mover a la columna siguiente', '›', statusIdx >= STATUS_ORDER.length - 1));
    actions.appendChild(move);
    if(a.status === 'done') actions.appendChild(actionButton('icon-btn', 'reuse', 'Reutilizar actividad', '↺'));
    actions.appendChild(actionButton('icon-btn', 'edit', 'Editar', '✎'));
    actions.appendChild(actionButton('icon-btn', 'delete', 'Eliminar', '✕'));
    top.appendChild(actions);
    card.appendChild(top);

    /* --- Reagendar --- */
    if(isRescheduling){
      const row = el('div', 'reschedule-row');
      const input = el('input', 'reschedule-input');
      input.type = 'date';
      input.value = a.due || '';
      input.setAttribute('aria-label', 'Nueva fecha límite');
      row.appendChild(input);
      const save = el('button', 'btn-mini save', 'Guardar'); save.type = 'button'; save.dataset.action = 'reschedule-save';
      const cancel = el('button', 'btn-mini ghost', 'Cancelar'); cancel.type = 'button'; cancel.dataset.action = 'reschedule-cancel';
      row.append(save, cancel);
      card.appendChild(row);
    }

    if(a.desc) card.appendChild(el('div', 'card-desc', a.desc));

    /* --- Checklist --- */
    if(a.checklist && a.checklist.length){
      const list = el('div', 'checklist');
      a.checklist.forEach(item => {
        const row = el('label', 'checklist-item' + (item.done ? ' done' : ''));
        const cb = el('input');
        cb.type = 'checkbox';
        cb.checked = item.done;
        row.append(cb, el('span', '', item.text));
        cb.addEventListener('change', () => {
          const act = activities.find(x => x.id === a.id);
          const actItem = act && act.checklist && act.checklist.find(it => it.id === item.id);
          if(actItem) actItem.done = cb.checked;
          persist();
          // No cambia columna, urgencia ni categorías: basta con actualizar esta fila
          row.classList.toggle('done', cb.checked);
        });
        list.appendChild(row);
      });
      card.appendChild(list);
    }

    /* --- Etiquetas --- */
    const tags = el('div', 'card-tags');
    const cat = el('span', 'category-tag', categoryKey(a.category));
    cat.style.background = catColor.bg;
    cat.style.color = catColor.text;
    cat.style.borderColor = catColor.border;
    tags.appendChild(cat);
    tags.appendChild(el('span', 'status-tag due-' + urgency, urgencyLabel(urgency, d)));
    if(a.recurrence && a.recurrence !== 'none'){
      const detail = recurrenceDetail(a);
      tags.appendChild(el('span', 'recurrence-tag', '↻ ' + recurrenceLabel[a.recurrence] + (detail ? ' · ' + detail : '')));
    }
    card.appendChild(tags);

    /* --- Progreso --- */
    if(a.status === 'progress' || a.status === 'done'){
      card.appendChild(buildProgressMeter(a.progress, a.status === 'done'));
    }
    if(a.status === 'progress'){
      const wrap = el('div', 'progress-buttons');
      PROGRESS_STEPS.forEach(v => {
        const b = el('button', 'progress-btn' + (a.progress === v ? ' active' : ''), v + '%');
        b.type = 'button';
        b.dataset.value = v;
        b.setAttribute('aria-label', 'Progreso ' + v + '%');
        b.setAttribute('aria-pressed', String(a.progress === v));
        wrap.appendChild(b);
      });
      card.appendChild(wrap);
    }

    return card;
  }

  // Barra con porcentaje; el ancho parte de 0 y se anima hasta el valor real
  function buildProgressMeter(value, complete){
    const pct = complete ? 100 : value;
    const meter = el('div', 'progress-meter');
    const track = el('div', 'progress-track');
    track.setAttribute('role', 'progressbar');
    track.setAttribute('aria-label', 'Avance de la actividad');
    track.setAttribute('aria-valuemin', '0');
    track.setAttribute('aria-valuemax', '100');
    track.setAttribute('aria-valuenow', String(pct));
    const fill = el('div', 'progress-fill' + (complete ? ' fill-complete' : ''));
    track.appendChild(fill);
    meter.append(track, el('span', 'progress-pct' + (complete ? ' pct-complete' : ''), pct + '%'));
    requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = pct + '%'; }));
    return meter;
  }

  /* ---------- Delegación de eventos del tablero ---------- */
  STATUS_ORDER.forEach(status => {
    const zone = $('zone-' + status);

    zone.addEventListener('click', (e) => {
      const card = e.target.closest('.card');
      if(!card) return;
      const id = card.dataset.id;
      const btn = e.target.closest('button');
      if(!btn || !card.contains(btn)) return;

      if(btn.classList.contains('progress-btn')){
        setProgress(id, parseInt(btn.dataset.value, 10), card);
        return;
      }
      switch(btn.dataset.action){
        case 'edit': openEdit(id); break;
        case 'delete': deleteActivity(id); break;
        case 'reuse': reuseActivity(id); break;
        case 'move-prev': stepActivity(id, -1); break;
        case 'move-next': stepActivity(id, +1); break;
        case 'reschedule': reschedulingIds.add(id); refresh(); break;
        case 'reschedule-cancel': reschedulingIds.delete(id); refresh(); break;
        case 'reschedule-save': {
          const input = card.querySelector('.reschedule-input');
          const act = activities.find(x => x.id === id);
          if(act){
            act.due = isValidISODate(input.value) ? input.value : '';
            reschedulingIds.delete(id);
            persist();
            refreshFiltered();
            showToast('Actividad reagendada');
          }
          break;
        }
      }
    });

    zone.addEventListener('dragstart', (e) => {
      const card = e.target.closest('.card');
      if(!card) return;
      draggingId = card.dataset.id;
      card.classList.add('dragging');
      if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', draggingId); }
    });
    zone.addEventListener('dragend', (e) => {
      const card = e.target.closest('.card');
      if(card) card.classList.remove('dragging');
      draggingId = null;
      document.querySelectorAll('.drop-zone.drag-over').forEach(z => z.classList.remove('drag-over'));
    });
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', (e) => {
      // Ignora los dragleave disparados al pasar por elementos hijos
      if(!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
    });
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      if(!draggingId) return;
      moveActivityToStatus(draggingId, status);
    });
  });

  function setProgress(id, val, card){
    const act = activities.find(x => x.id === id);
    if(!act) return;
    act.progress = val;
    if(val === 100 && act.status !== 'done'){
      act.status = 'done';
      justMovedId = act.id;
      spawnRecurrence(act);
      persist();
      refresh(); // cambia de columna: hay que reconstruir el tablero
    } else {
      persist();
      // Progreso dentro de la misma columna: solo actualizar los botones de esta tarjeta
      card.querySelectorAll('.progress-btn').forEach(b => {
        const on = parseInt(b.dataset.value, 10) === val;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
      const fill = card.querySelector('.progress-fill');
      const label = card.querySelector('.progress-pct');
      const track = card.querySelector('.progress-track');
      if(fill && label && track){
        fill.style.width = val + '%'; // la transición CSS anima el cambio
        label.textContent = val + '%';
        track.setAttribute('aria-valuenow', String(val));
      }
    }
  }

  function stepActivity(id, delta){
    const act = activities.find(a => a.id === id);
    if(!act) return;
    const idx = STATUS_ORDER.indexOf(act.status) + delta;
    if(idx >= 0 && idx < STATUS_ORDER.length) moveActivityToStatus(id, STATUS_ORDER[idx]);
  }

  function moveActivityToStatus(id, status){
    const act = activities.find(a => a.id === id);
    if(!act || act.status === status) return;
    const wasDone = act.status === 'done';
    act.status = status;
    if(status === 'done'){
      act.progress = 100;
      if(!wasDone) spawnRecurrence(act);
    } else if(status === 'todo'){
      act.progress = 0;
    } else if(act.progress === 100 || act.progress === 0){
      // Al reabrir una actividad completada, no debe quedar marcada al 100 %
      act.progress = wasDone ? 75 : 25;
    }
    justMovedId = act.id;
    persist();
    refresh();
  }

  $('clearDoneBtn').addEventListener('click', () => {
    const doneCount = activities.filter(a => a.status === 'done').length;
    if(doneCount === 0) return;
    if(confirm('¿Eliminar las ' + doneCount + ' actividades completadas?')){
      activities = activities.filter(a => a.status !== 'done');
      persist();
      refresh();
      showToast('Columna de completados vaciada');
    }
  });

  function deleteActivity(id){
    activities = activities.filter(a => a.id !== id);
    reschedulingIds.delete(id);
    persist();
    refresh();
    showToast('Actividad eliminada');
  }

  function reuseActivity(id){
    const a = activities.find(x => x.id === id);
    if(!a) return;
    activities.push({
      id:uid(), title:a.title, desc:a.desc, category:a.category, colorIndex:a.colorIndex,
      due:'', priority:a.priority, status:'todo', progress:0, recurrence:a.recurrence,
      recurrenceDays:a.recurrenceDays, recurrenceDayOfMonth:a.recurrenceDayOfMonth,
      checklist:cloneChecklist(a.checklist), spawned:false
    });
    persist();
    refresh();
    showToast('Actividad reutilizada en Pendiente');
  }

  /* ---------- Modal ---------- */
  /* ---------- Categorías predefinidas ---------- */
  const catOverlay = $('catOverlay');
  const catColorSelect = $('catColorSelect');
  const catForm = $('catForm');
  let catColorIndex = 0;

  function sanitizePresets(list){
    if(!Array.isArray(list)) return null;
    const seen = new Set();
    const clean = [];
    for(const raw of list){
      if(!raw || typeof raw.name !== 'string') continue;
      const name = raw.name.trim().slice(0, 20);
      const key = name.toLowerCase();
      if(!name || seen.has(key)) continue;
      seen.add(key);
      clean.push({
        id: typeof raw.id === 'string' && ID_RE.test(raw.id) ? raw.id : uid(),
        name,
        colorIndex: Number.isInteger(raw.colorIndex) && categoryPalette[raw.colorIndex] ? raw.colorIndex : 0
      });
    }
    return clean;
  }

  function defaultPresets(){
    return [
      { id:uid(), name:'Trabajo',  colorIndex:0 },
      { id:uid(), name:'Personal', colorIndex:1 },
      { id:uid(), name:'Salud',    colorIndex:2 }
    ];
  }

  function loadPresets(){
    try{
      const raw = localStorage.getItem(PRESETS_KEY);
      const parsed = raw ? sanitizePresets(JSON.parse(raw)) : null;
      if(parsed){
        presets = parsed;
      } else {
        presets = defaultPresets();
        persistPresets();
      }
    }catch(e){
      console.error('No se pudieron leer las categorías', e);
      presets = defaultPresets();
    }
  }

  function persistPresets(){
    try{
      localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
    }catch(e){
      console.error('No se pudieron guardar las categorías', e);
      showToast('No se pudo guardar localmente');
    }
  }

  // Chips seleccionables dentro del formulario de actividad
  function renderPresetChips(){
    const box = $('presetChips');
    box.innerHTML = '';
    if(!presets.length){
      box.appendChild(el('div', 'preset-empty', 'Aún no hay categorías predefinidas. Créalas con el botón «Categorías» del encabezado.'));
      return;
    }
    const current = $('f-category').value.trim().toLowerCase();
    presets.forEach(p => {
      const on = current === p.name.toLowerCase();
      const chip = el('button', 'preset-chip' + (on ? ' selected' : ''));
      chip.type = 'button';
      chip.setAttribute('aria-pressed', String(on));
      const dot = el('span', 'preset-dot');
      dot.style.background = categoryPalette[p.colorIndex].dot;
      chip.append(dot, el('span', '', p.name));
      chip.addEventListener('click', () => {
        if(on){
          $('f-category').value = '';
        } else {
          $('f-category').value = p.name;
          setColorIndex(p.colorIndex);
        }
        renderPresetChips();
      });
      box.appendChild(chip);
    });
  }

  $('f-category').addEventListener('input', renderPresetChips);

  // Gestor de categorías predefinidas
  categoryPalette.forEach((color, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = color.dot;
    sw.dataset.index = i;
    sw.title = color.name;
    sw.tabIndex = 0;
    sw.setAttribute('role', 'button');
    sw.setAttribute('aria-label', color.name);
    sw.setAttribute('aria-pressed', 'false');
    catColorSelect.appendChild(sw);
  });

  function setCatColor(i){
    catColorIndex = i;
    [...catColorSelect.children].forEach(node => {
      const on = parseInt(node.dataset.index, 10) === i;
      node.classList.toggle('selected', on);
      node.setAttribute('aria-pressed', String(on));
    });
  }

  catColorSelect.addEventListener('click', (e) => {
    const sw = e.target.closest('.color-swatch');
    if(sw) setCatColor(parseInt(sw.dataset.index, 10));
  });
  enableKeyboardActivation(catColorSelect, '.color-swatch');

  function renderPresetManager(){
    const list = $('presetManageList');
    list.innerHTML = '';
    if(!presets.length){
      list.appendChild(el('div', 'preset-empty', 'Todavía no has creado categorías.'));
      return;
    }
    presets.forEach(p => {
      const row = el('div', 'preset-manage-item');
      const dot = el('span', 'preset-dot');
      dot.style.background = categoryPalette[p.colorIndex].dot;
      const del = el('button', '', '✕');
      del.type = 'button';
      del.title = 'Eliminar categoría';
      del.setAttribute('aria-label', 'Eliminar categoría ' + p.name);
      del.addEventListener('click', () => {
        presets = presets.filter(x => x.id !== p.id);
        persistPresets();
        renderPresetManager();
        refreshCategoryDatalist();
        showToast('Categoría eliminada (las actividades existentes no cambian)');
      });
      row.append(dot, el('span', 'name', p.name), del);
      list.appendChild(row);
    });
  }

  function openCatManager(){
    lastFocused = document.activeElement;
    $('c-name').value = '';
    setCatColor(presets.length % categoryPalette.length);
    renderPresetManager();
    catOverlay.classList.add('open');
    $('c-name').focus();
  }

  function closeCatManager(){
    catOverlay.classList.remove('open');
    if(lastFocused && document.contains(lastFocused)) lastFocused.focus();
    lastFocused = null;
  }

  catForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('c-name').value.trim();
    if(!name) return;
    if(presets.some(p => p.name.toLowerCase() === name.toLowerCase())){
      showToast('Ya existe una categoría con ese nombre');
      return;
    }
    presets.push({ id:uid(), name, colorIndex:catColorIndex });
    persistPresets();
    renderPresetManager();
    refreshCategoryDatalist();
    $('c-name').value = '';
    setCatColor((catColorIndex + 1) % categoryPalette.length);
    $('c-name').focus();
    showToast('Categoría añadida');
  });

  $('manageCatsBtn').addEventListener('click', openCatManager);
  $('catCloseBtn').addEventListener('click', closeCatManager);
  catOverlay.addEventListener('mousedown', (e) => { if(e.target === catOverlay) closeCatManager(); });

  function openModal(){
    lastFocused = document.activeElement;
    renderPresetChips();
    overlay.classList.add('open');
    $('f-title').focus();
  }

  function closeModal(){
    overlay.classList.remove('open');
    editingId = null;
    if(lastFocused && document.contains(lastFocused)) lastFocused.focus();
    lastFocused = null;
  }

  function openEdit(id){
    const a = activities.find(x => x.id === id);
    if(!a) return;
    editingId = id;
    $('modalTitle').textContent = 'Editar actividad';
    $('f-title').value = a.title;
    $('f-desc').value = a.desc || '';
    $('f-category').value = a.category || '';
    $('f-due').value = a.due || '';
    $('f-recurrence').value = a.recurrence || 'none';
    setPriority(a.priority);
    const idx = Number.isInteger(a.colorIndex) ? a.colorIndex : categoryPalette.indexOf(categoryColor(a.category));
    setColorIndex(idx);
    checklistDraft = (a.checklist || []).map(it => ({ ...it }));
    renderChecklistDraft();
    setWeekdays(a.recurrenceDays || []);
    monthdaySelect.value = a.recurrenceDayOfMonth || new Date().getDate();
    toggleRecurrenceFields();
    openModal();
  }

  function openNew(){
    editingId = null;
    $('modalTitle').textContent = 'Nueva actividad';
    form.reset();
    setPriority('media');
    setColorIndex(0);
    checklistDraft = [];
    renderChecklistDraft();
    $('f-recurrence').value = 'none';
    setWeekdays([]);
    monthdaySelect.value = new Date().getDate();
    toggleRecurrenceFields();
    openModal();
  }

  $('openModalBtn').addEventListener('click', openNew);
  $('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('mousedown', (e) => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => {
    const openOverlay = [overlay, catOverlay].find(o => o.classList.contains('open'));
    if(!openOverlay) return;
    if(e.key === 'Escape'){ if(openOverlay === overlay) closeModal(); else closeCatManager(); return; }
    // Mantiene el foco dentro del diálogo mientras está abierto
    if(e.key === 'Tab'){
      const focusables = [...openOverlay.querySelectorAll('button:not([disabled]), input:not([hidden]), select, textarea, [tabindex="0"]')]
        .filter(n => n.offsetParent !== null);
      if(!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = $('f-title').value.trim();
    if(!title) return;
    const priority = prioritySelect.querySelector('.selected').dataset.value;
    const recurrence = recurrenceSelect.value;
    const recurrenceDays = recurrence === 'weekly' ? [...selectedWeekdays].sort((x,y) => x - y) : undefined;
    const recurrenceDayOfMonth = recurrence === 'monthly' ? parseInt(monthdaySelect.value, 10) : undefined;
    const checklist = checklistDraft.map(it => ({ ...it }));
    const fields = {
      title,
      desc:$('f-desc').value.trim(),
      category:$('f-category').value.trim(),
      due:$('f-due').value,
      priority, recurrence, recurrenceDays, recurrenceDayOfMonth,
      colorIndex:selectedColorIndex, checklist
    };

    if(editingId){
      const a = activities.find(x => x.id === editingId);
      if(a){
        // Si cambia la regla de repetición, se permite generar de nuevo la siguiente ocurrencia
        if(a.recurrence !== recurrence) a.spawned = false;
        Object.assign(a, fields);
      }
      showToast('Actividad actualizada');
    } else {
      activities.push({ id:uid(), status:'todo', progress:0, spawned:false, ...fields });
      showToast('Actividad creada');
    }
    persist();
    closeModal();
    refresh();
  });

  /* ---------- Búsqueda ---------- */
  let searchDebounceTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(refreshFiltered, 150);
  });

  /* ---------- Cambio de vista ---------- */
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.dataset.view;
      document.querySelectorAll('.view-btn').forEach(b => {
        const on = b === btn;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
      $('boardView').style.display = currentView === 'board' ? 'grid' : 'none';
      $('calendarView').style.display = currentView === 'calendar' ? 'flex' : 'none';
      if(currentView === 'calendar') renderCalendar();
    });
  });

  /* ---------- Calendario ---------- */
  function renderCalendar(){
    if(currentView !== 'calendar') return;
    const grid = $('calendarGrid');
    grid.innerHTML = '';

    const year = calState.getFullYear();
    const month = calState.getMonth();
    $('calLabel').textContent = calState.toLocaleDateString(LOCALE, { month:'long', year:'numeric' });

    const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    const todayStr = isoDate(new Date());

    // Agrupa por fecha una sola vez en lugar de filtrar para cada celda
    const byDate = new Map();
    for(const a of activities){
      if(!a.due || !matches(a)) continue;
      if(!byDate.has(a.due)) byDate.set(a.due, []);
      byDate.get(a.due).push(a);
    }

    const frag = document.createDocumentFragment();
    for(let i = 0; i < totalCells; i++){
      // new Date normaliza días fuera de rango (meses anterior/siguiente)
      const cellDate = new Date(year, month, i - startOffset + 1);
      const otherMonth = cellDate.getMonth() !== month;
      const iso = isoDate(cellDate);

      const cell = el('div', 'cal-cell' + (otherMonth ? ' other-month' : '') + (iso === todayStr ? ' is-today' : ''));
      cell.appendChild(el('div', 'cal-daynum', String(cellDate.getDate())));

      const dayEvents = sortByDue(byDate.get(iso) || []);
      dayEvents.slice(0, 3).forEach(a => {
        const u = urgencyOf(a);
        const color = categoryColorFor(a);
        const ev = el('div', 'cal-event' + (u === 'overdue' ? ' is-overdue' : u === 'soon' ? ' is-soon' : u === 'done' ? ' is-done' : ''));
        const dot = el('span', 'cal-event-dot');
        dot.style.background = color.dot;
        ev.append(dot, el('span', '', a.title));
        ev.title = a.title;
        ev.tabIndex = 0;
        ev.setAttribute('role', 'button');
        ev.addEventListener('click', () => openEdit(a.id));
        ev.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEdit(a.id); } });
        cell.appendChild(ev);
      });
      if(dayEvents.length > 3) cell.appendChild(el('div', 'cal-more', '+' + (dayEvents.length - 3) + ' más'));

      frag.appendChild(cell);
    }
    grid.appendChild(frag);
  }

  // Se navega siempre desde el día 1 para evitar saltos de mes (p. ej. 31 → mes de 30 días)
  $('calPrev').addEventListener('click', () => { calState = new Date(calState.getFullYear(), calState.getMonth() - 1, 1); renderCalendar(); });
  $('calNext').addEventListener('click', () => { calState = new Date(calState.getFullYear(), calState.getMonth() + 1, 1); renderCalendar(); });
  $('calToday').addEventListener('click', () => { calState = startOfMonth(new Date()); renderCalendar(); });

  loadPresets();
  loadActivities();
})();
</script>
</body>
</html>
