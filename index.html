<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento — Actividades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1013;
    --surface:#17181C;
    --surface-2:#1E2025;
    --surface-3:#272A31;
    --surface-4:#31343C;
    --border:#2C2F37;
    --border-soft:#212327;
    --border-strong:#40444E;

    --text:#F3F1EC;
    --text-secondary:#C2C4CB;
    --text-dim:#9A9DA6;
    --text-faint:#63666F;

    --accent:#8388F0;
    --accent-strong:#9BA0F7;
    --accent-soft:rgba(131,136,240,0.16);
    --accent-border:rgba(131,136,240,0.4);

    --warm:#E7AC55;
    --warm-strong:#F2BE72;
    --warm-soft:rgba(231,172,85,0.16);
    --warm-border:rgba(231,172,85,0.45);

    --danger:#EA6E5F;
    --danger-strong:#FF8672;
    --danger-soft:rgba(234,110,95,0.15);
    --danger-border:rgba(234,110,95,0.55);

    --success:#78C39C;
    --success-strong:#8FDBB2;
    --success-soft:rgba(120,195,156,0.15);
    --success-border:rgba(120,195,156,0.4);

    --radius:10px;
    --font:'Barlow Condensed', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--text); font-family:var(--font); height:100%; }
  body{ min-height:100vh; display:flex; flex-direction:column; font-size:15px; }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 32px; border-bottom:1px solid var(--border-soft); flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:12px; }
  .brand h1{ font-family:var(--font); font-weight:700; font-size:25px; letter-spacing:0.2px; }
  .brand .today{
    font-family:var(--font); font-weight:500; font-size:25px; color:var(--accent-strong);
    text-transform:capitalize; letter-spacing:0.2px;
  }

  .header-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .view-toggle{ display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px; }
  .view-btn{
    background:none; border:none; color:var(--text-dim); font-family:var(--font); font-weight:600;
    font-size:14px; padding:6px 14px; border-radius:6px; cursor:pointer; transition:background .12s ease, color .12s ease;
  }
  .view-btn.active{ background:var(--surface-4); color:var(--text); }
  .view-btn:hover:not(.active){ color:var(--text-secondary); }

  .btn-primary{
    background:var(--accent); color:#0F1013; border:none; border-radius:8px; padding:9px 16px;
    font-family:var(--font); font-weight:700; font-size:14.5px; cursor:pointer;
    transition:filter .15s ease, transform .1s ease; white-space:nowrap;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:active{ transform:scale(0.98); }

  /* ---------- Filter bar ---------- */
  .filter-bar{
    display:flex; align-items:center; gap:14px; padding:14px 32px; border-bottom:1px solid var(--border-soft);
    flex-wrap:wrap;
  }
  .search{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px;
    font-family:var(--font); font-size:14.5px; color:var(--text); width:220px; transition:border-color .15s ease;
  }
  .search::placeholder{ color:var(--text-faint); }
  .search:focus{ outline:none; border-color:var(--accent); }

  .tag-list{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tag-chip{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:5px 12px 5px 10px; font-size:13px; font-weight:500; color:var(--text-dim); cursor:pointer;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .tag-chip .tag-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .tag-chip .tag-count{ font-family:var(--font); font-size:11.5px; color:var(--text-faint); }
  .tag-chip:hover{ border-color:var(--border-strong); color:var(--text-secondary); }
  .tag-chip.active{ background:var(--surface-3); color:var(--text); border-color:var(--border-strong); }
  .tag-chip.tag-all{ font-weight:700; }
  .tag-chip.tag-all.active{ background:var(--accent-soft); border-color:var(--accent-border); color:var(--accent-strong); }

  /* ---------- Board ---------- */
  main{ flex:1; padding:24px 32px 40px; overflow-x:auto; }
  .board{ display:grid; grid-template-columns:repeat(3, minmax(280px, 1fr)); gap:20px; min-width:900px; }
  .column{ display:flex; flex-direction:column; min-height:200px; }
  .column-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; }
  .column-title{ display:flex; align-items:center; gap:8px; font-family:var(--font); font-size:18px; font-weight:600; color:var(--text); }
  .column-head-right{ display:flex; align-items:center; gap:8px; }
  .column-count{ font-family:var(--font); font-size:13px; color:var(--text-faint); }
  .column-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot-todo{ background:var(--text-faint); }
  .dot-progress{ background:var(--warm); }
  .dot-done{ background:var(--success); }

  .clear-btn{
    background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:12.5px; font-family:var(--font);
    padding:2px 6px; border-radius:5px; transition:color .12s ease, background .12s ease;
  }
  .clear-btn:hover{ color:var(--danger-strong); background:var(--danger-soft); }

  .flow-bar{ height:2px; background:var(--border-soft); border-radius:2px; margin-bottom:14px; overflow:hidden; }
  .flow-bar-fill{ height:100%; transition:width .25s ease; }
  .fill-todo{ background:var(--text-faint); }
  .fill-progress{ background:var(--warm); }
  .fill-done{ background:var(--success); }

  .drop-zone{ flex:1; display:flex; flex-direction:column; gap:10px; min-height:120px; border-radius:var(--radius); padding:2px; transition:background .15s ease; }
  .drop-zone.drag-over{ background:var(--surface-2); outline:1px dashed var(--border-strong); }

  .empty-state{ border:1px dashed var(--border-soft); border-radius:var(--radius); padding:24px 14px; text-align:center; color:var(--text-faint); font-size:13.5px; line-height:1.5; }

  /* ---------- Card ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border-strong);
    border-radius:var(--radius); padding:14px 14px 12px; cursor:grab; position:relative;
    transition:border-color .15s ease, transform .1s ease, background .15s ease;
  }
  .card:hover{ border-color:#3a3e47; }
  .card.dragging{ opacity:0.4; }

  .card.card-moved{ animation:cardMoveIn 0.32s ease; }
  @keyframes cardMoveIn{
    0%{ opacity:0; transform:translateY(-8px) scale(0.96); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .card.urgency-overdue{ border-left-color:var(--danger); background:linear-gradient(180deg, var(--danger-soft), var(--surface) 55%); }
  .card.urgency-soon{ border-left-color:var(--warm); }
  .card.urgency-done{ border-left-color:var(--success); }

  .pulse-dot{
    position:absolute; top:12px; right:12px; width:7px; height:7px; border-radius:50%; background:var(--danger-strong);
    box-shadow:0 0 0 0 rgba(234,110,95,0.6); animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(234,110,95,0.55); }
    70%{ box-shadow:0 0 0 7px rgba(234,110,95,0); }
    100%{ box-shadow:0 0 0 0 rgba(234,110,95,0); }
  }

  .card-top{ display:flex; align-items:flex-start; gap:8px; margin-bottom:6px; padding-right:16px; }
  .priority-mark{ font-family:var(--font); font-weight:700; font-size:15px; line-height:1; margin-top:2px; flex-shrink:0; width:10px; text-align:center; }
  .priority-alta{ color:var(--warm-strong); }
  .priority-media{ color:var(--text-secondary); }
  .priority-baja{ color:var(--text-faint); }

  .card-title{ font-family:var(--font); font-weight:600; font-size:16.5px; line-height:1.25; flex:1; color:var(--text); }
  .card.done .card-title{ color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--border-strong); }

  .card-actions{ display:flex; align-items:center; gap:4px; opacity:0; transition:opacity .12s ease; flex-shrink:0; }
  .card:hover .card-actions{ opacity:1; }
  .icon-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px 4px; line-height:1; border-radius:4px; }
  .icon-btn:hover{ color:var(--text); background:var(--surface-3); }

  /* Movimiento entre columnas: alterna al drag & drop, imprescindible en táctil */
  .move-controls{ display:flex; gap:2px; margin-right:2px; }
  .move-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim); cursor:pointer; font-size:13px;
    width:22px; height:22px; line-height:1; border-radius:5px; display:flex; align-items:center; justify-content:center;
    transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .move-btn:hover{ border-color:var(--border-strong); color:var(--text); background:var(--surface-3); }
  .move-btn:disabled{ opacity:0; pointer-events:none; }

  /* En pantallas táctiles no hay :hover, así que las acciones de la tarjeta
     (editar/eliminar/mover) deben quedar siempre visibles */
  @media (hover:none){
    .card-actions{ opacity:1; }
  }

  .card-desc{ font-size:14.5px; color:var(--text-secondary); line-height:1.5; margin:6px 0 10px 18px; }

  .card-tags{ display:flex; align-items:center; gap:6px; margin-left:18px; flex-wrap:wrap; }

  .category-tag{ font-family:var(--font); font-weight:600; font-size:13.5px; text-transform:uppercase; letter-spacing:0.03em; padding:4px 11px; border-radius:20px; border:1px solid transparent; }

  .status-tag{
    font-family:var(--font); font-weight:800; font-size:13.5px; text-transform:uppercase; letter-spacing:0.03em;
    padding:4px 11px; border-radius:20px; border:1px solid transparent;
  }
  .status-tag.due-ok{ color:var(--text); background:var(--surface-2); border-color:var(--border); }
  .status-tag.due-soon{ color:var(--warm-strong); background:var(--warm-soft); border-color:var(--warm-border); box-shadow:0 0 0 1px rgba(231,172,85,0.12); }
  .status-tag.due-overdue{ color:var(--danger-strong); background:var(--danger-soft); border-color:var(--danger-border); box-shadow:0 0 0 1px rgba(234,110,95,0.15); }
  .status-tag.due-done{ color:var(--success-strong); background:var(--success-soft); border-color:var(--success-border); }
  .status-tag.due-none{ color:var(--text-dim); background:var(--surface-2); border-color:var(--border-soft); }

  .recurrence-tag{ font-family:var(--font); font-weight:600; font-size:13.5px; color:var(--text-dim); background:var(--surface-2); padding:4px 11px; border-radius:20px; display:flex; align-items:center; gap:4px; }

  .due-corner{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; margin-left:8px; }
  .due-badge{
    font-family:var(--font); font-weight:700; font-size:13.5px; white-space:nowrap;
    padding:4px 11px; border-radius:20px; border:1px solid transparent;
  }
  .due-badge.due-ok{ color:var(--text); background:var(--surface-2); border-color:var(--border); }
  .due-badge.due-soon{ color:var(--warm-strong); background:var(--warm-soft); border-color:var(--warm-border); }
  .due-badge.due-overdue{ color:var(--danger-strong); background:var(--danger-soft); border-color:var(--danger-border); }
  .due-badge.due-done{ color:var(--success-strong); background:var(--success-soft); border-color:var(--success-border); }
  .due-badge.due-none{ color:var(--text-dim); background:var(--surface-2); border-color:var(--border-soft); }

  .reschedule-btn{
    background:none; border:1px solid var(--danger-border); color:var(--danger-strong); font-family:var(--font);
    font-weight:600; font-size:12px; padding:4px 10px; border-radius:7px; cursor:pointer; transition:background .12s ease;
  }
  .reschedule-btn:hover{ background:var(--danger-soft); }

  .reschedule-row{ display:flex; align-items:center; gap:6px; margin:2px 0 8px 18px; flex-wrap:wrap; }
  .reschedule-row input[type="date"]{
    background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:5px 7px;
    color:var(--text); font-family:var(--font); font-size:13px; flex:1; min-width:120px;
  }
  .btn-mini{
    font-family:var(--font); font-weight:600; font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer; border:none;
  }
  .btn-mini.save{ background:var(--accent); color:#0F1013; }
  .btn-mini.ghost{ background:none; border:1px solid var(--border); color:var(--text-dim); }

  .progress-track{ margin:10px 0 0 18px; height:4px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--success); }

  .progress-buttons{ display:flex; gap:4px; margin:10px 0 0 18px; }
  .progress-btn{
    flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text-faint);
    font-family:var(--font); font-weight:600; font-size:12px; padding:5px 0; border-radius:6px; cursor:pointer;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .progress-btn:hover{ border-color:var(--border-strong); color:var(--text-secondary); }
  .progress-btn.active{ background:var(--accent-soft); border-color:var(--accent-border); color:var(--accent-strong); font-weight:700; }

  /* ---------- Checklist ---------- */
  .checklist{ display:flex; flex-direction:column; gap:5px; margin:6px 0 10px 18px; }
  .checklist-item{ display:flex; align-items:flex-start; gap:8px; font-size:13px; color:var(--text-dim); cursor:pointer; }
  .checklist-item input[type="checkbox"]{
    appearance:none; -webkit-appearance:none; width:15px; height:15px; margin-top:1px; border:1.5px solid var(--border-strong);
    border-radius:4px; cursor:pointer; flex-shrink:0; position:relative; background:var(--surface-2);
  }
  .checklist-item input[type="checkbox"]:checked{ background:var(--accent); border-color:var(--accent); }
  .checklist-item input[type="checkbox"]:checked::after{
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; color:#0F1013; font-weight:700;
  }
  .checklist-item span{ flex:1; line-height:1.35; }
  .checklist-item.done span{ text-decoration:line-through; color:var(--text-faint); }

  /* ---------- Calendar ---------- */
  .calendar{ display:flex; flex-direction:column; gap:14px; }
  .cal-nav{ display:flex; align-items:center; gap:12px; }
  .cal-nav-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text-secondary); width:30px; height:30px;
    border-radius:8px; cursor:pointer; font-size:16px; line-height:1; transition:border-color .12s ease, color .12s ease;
  }
  .cal-nav-btn:hover{ border-color:var(--border-strong); color:var(--text); }
  .cal-label{ font-family:var(--font); font-size:19px; font-weight:600; text-transform:capitalize; min-width:160px; }

  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-weekdays span{ font-family:var(--font); font-weight:600; font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; text-align:center; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-cell{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:9px; min-height:96px;
    padding:8px; display:flex; flex-direction:column; gap:5px;
  }
  .cal-cell.other-month{ opacity:0.4; }
  .cal-cell.is-today{ border-color:var(--accent-border); background:var(--accent-soft); }
  .cal-daynum{ font-family:var(--font); font-size:13px; color:var(--text-dim); align-self:flex-end; }
  .cal-cell.is-today .cal-daynum{ color:var(--accent-strong); font-weight:700; }

  .cal-event{
    display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-secondary); background:var(--surface-2);
    border-radius:5px; padding:3px 6px; cursor:pointer; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    transition:background .12s ease;
  }
  .cal-event:hover{ background:var(--surface-3); }
  .cal-event .cal-event-dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .cal-event.is-overdue{ color:var(--danger-strong); font-weight:600; }
  .cal-event.is-soon{ color:var(--warm-strong); font-weight:600; }
  .cal-event.is-done{ color:var(--text-faint); text-decoration:line-through; }
  .cal-more{ font-family:var(--font); font-size:11.5px; color:var(--text-faint); padding-left:2px; }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(6,7,9,0.65); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:420px; padding:24px; max-height:90vh; overflow-y:auto; }
  .modal h2{ font-family:var(--font); font-weight:700; font-size:21px; margin-bottom:18px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); margin-bottom:6px; font-family:var(--font); }
  .field input[type="text"], .field textarea, .field select, .field input[type="date"]{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 10px;
    color:var(--text); font-family:var(--font); font-size:15px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:56px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }

  .color-select{ display:flex; gap:9px; flex-wrap:wrap; padding-top:2px; }
  .color-swatch{
    width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;
    position:relative; transition:transform .1s ease, border-color .12s ease; flex-shrink:0;
  }
  .color-swatch:hover{ transform:scale(1.08); }
  .color-swatch.selected{ border-color:var(--text); box-shadow:0 0 0 2px var(--surface); }
  .color-swatch.selected::after{
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:#0F1013;
  }

  .priority-select{ display:flex; gap:8px; }
  .priority-option{
    flex:1; text-align:center; padding:8px 4px; border:1px solid var(--border); border-radius:8px; font-size:13.5px;
    cursor:pointer; color:var(--text-dim); font-family:var(--font); font-weight:500; transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .priority-option.selected{ border-color:var(--accent-border); color:var(--text); background:var(--accent-soft); }

  .weekday-select{ display:flex; gap:6px; }
  .weekday-option{
    flex:1; text-align:center; padding:8px 0; border:1px solid var(--border); border-radius:8px; font-size:13px;
    cursor:pointer; color:var(--text-dim); font-family:var(--font); font-weight:700; transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .weekday-option.selected{ border-color:var(--accent-border); color:var(--text); background:var(--accent-soft); }

  .checklist-builder{ display:flex; flex-direction:column; gap:8px; }
  .checklist-add-row{ display:flex; gap:6px; }
  .checklist-add-row input{ flex:1; }
  .checklist-draft-list{ display:flex; flex-direction:column; gap:6px; max-height:140px; overflow-y:auto; }
  .checklist-draft-item{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:7px; padding:6px 9px; font-size:13.5px; color:var(--text);
  }
  .checklist-draft-item span{ flex:1; }
  .checklist-draft-item button{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:13px; padding:2px; line-height:1; }
  .checklist-draft-item button:hover{ color:var(--danger-strong); }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .btn-ghost{ background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:9px 16px; font-size:14.5px; cursor:pointer; font-family:var(--font); font-weight:500; }
  .btn-ghost:hover{ color:var(--text); border-color:var(--border-strong); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--surface-4);
    border:1px solid var(--border-strong); color:var(--text); padding:10px 18px; border-radius:8px; font-size:13.5px;
    font-family:var(--font); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:820px){
    .board{ grid-template-columns:1fr; min-width:0; }
    main{ padding:18px; }
    header{ padding:16px 18px; }
    .filter-bar{ padding:12px 18px; }
    .cal-cell{ min-height:70px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Seguimiento</h1>
    <span class="today" id="todayLabel"></span>
  </div>
  <div class="header-actions">
    <div class="view-toggle">
      <button class="view-btn active" data-view="board">Tablero</button>
      <button class="view-btn" data-view="calendar">Calendario</button>
    </div>
    <button class="btn-ghost" id="exportBtn" title="Descargar copia de seguridad en JSON">Exportar</button>
    <button class="btn-ghost" id="importBtn" title="Cargar actividades desde un archivo JSON">Importar</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button class="btn-primary" id="openModalBtn">+ Nueva actividad</button>
  </div>
</header>

<div class="filter-bar">
  <input type="text" class="search" id="searchInput" placeholder="Buscar actividad…">
  <div class="tag-list" id="tagList"></div>
</div>

<main>
  <div class="board" id="boardView">
    <div class="column" data-status="todo">
      <div class="column-head">
        <div class="column-title"><span class="column-dot dot-todo"></span>Pendiente</div>
        <div class="column-head-right"><span class="column-count" id="count-todo">0</span></div>
      </div>
      <div class="flow-bar"><div class="flow-bar-fill fill-todo" id="flow-todo" style="width:0%"></div></div>
      <div class="drop-zone" id="zone-todo" data-status="todo"></div>
    </div>

    <div class="column" data-status="progress">
      <div class="column-head">
        <div class="column-title"><span class="column-dot dot-progress"></span>En progreso</div>
        <div class="column-head-right"><span class="column-count" id="count-progress">0</span></div>
      </div>
      <div class="flow-bar"><div class="flow-bar-fill fill-progress" id="flow-progress" style="width:0%"></div></div>
      <div class="drop-zone" id="zone-progress" data-status="progress"></div>
    </div>

    <div class="column" data-status="done">
      <div class="column-head">
        <div class="column-title"><span class="column-dot dot-done"></span>Completado</div>
        <div class="column-head-right">
          <span class="column-count" id="count-done">0</span>
          <button class="clear-btn" id="clearDoneBtn" title="Vaciar completados">Limpiar</button>
        </div>
      </div>
      <div class="flow-bar"><div class="flow-bar-fill fill-done" id="flow-done" style="width:0%"></div></div>
      <div class="drop-zone" id="zone-done" data-status="done"></div>
    </div>
  </div>

  <div class="calendar" id="calendarView" style="display:none">
    <div class="cal-nav">
      <button class="cal-nav-btn" id="calPrev">‹</button>
      <span class="cal-label" id="calLabel"></span>
      <button class="cal-nav-btn" id="calNext">›</button>
      <button class="btn-ghost" id="calToday">Hoy</button>
    </div>
    <div class="cal-weekdays">
      <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
    </div>
    <div class="cal-grid" id="calendarGrid"></div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Nueva actividad</h2>
    <form id="activityForm">
      <div class="field">
        <label for="f-title">Título</label>
        <input type="text" id="f-title" required maxlength="80" placeholder="Ej. Terminar informe mensual">
      </div>
      <div class="field">
        <label for="f-desc">Descripción (opcional)</label>
        <textarea id="f-desc" maxlength="200" placeholder="Detalles o notas breves…"></textarea>
      </div>
      <div class="field">
        <label for="f-checklist-input">Lista de tareas (opcional)</label>
        <div class="checklist-builder">
          <div class="checklist-add-row">
            <input type="text" id="f-checklist-input" maxlength="80" placeholder="Ej. Reunir los materiales">
            <button type="button" class="btn-mini save" id="checklistAddBtn">Agregar</button>
          </div>
          <div class="checklist-draft-list" id="checklistDraftList"></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-category">Categoría</label>
          <input type="text" id="f-category" maxlength="20" placeholder="Ej. Trabajo" list="categoryList">
          <datalist id="categoryList"></datalist>
        </div>
        <div class="field">
          <label for="f-due">Fecha límite</label>
          <input type="date" id="f-due">
        </div>
      </div>
      <div class="field">
        <label id="colorSelectLabel">Color de la etiqueta</label>
        <div class="color-select" id="colorSelect" role="group" aria-labelledby="colorSelectLabel"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label id="prioritySelectLabel">Prioridad</label>
          <div class="priority-select" id="prioritySelect" role="group" aria-labelledby="prioritySelectLabel">
            <div class="priority-option" data-value="baja" tabindex="0" role="button">– Baja</div>
            <div class="priority-option selected" data-value="media" tabindex="0" role="button">● Media</div>
            <div class="priority-option" data-value="alta" tabindex="0" role="button">◆ Alta</div>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="f-recurrence">Repetir</label>
        <select id="f-recurrence">
          <option value="none">No se repite</option>
          <option value="weekly">Semanalmente</option>
          <option value="monthly">Mensualmente</option>
        </select>
      </div>
      <div class="field" id="weeklyDaysField" style="display:none">
        <label id="weekdaySelectLabel">Días de la semana</label>
        <div class="weekday-select" id="weekdaySelect" role="group" aria-labelledby="weekdaySelectLabel">
          <div class="weekday-option" data-value="1" tabindex="0" role="button">L</div>
          <div class="weekday-option" data-value="2" tabindex="0" role="button">M</div>
          <div class="weekday-option" data-value="3" tabindex="0" role="button">X</div>
          <div class="weekday-option" data-value="4" tabindex="0" role="button">J</div>
          <div class="weekday-option" data-value="5" tabindex="0" role="button">V</div>
          <div class="weekday-option" data-value="6" tabindex="0" role="button">S</div>
          <div class="weekday-option" data-value="7" tabindex="0" role="button">D</div>
        </div>
      </div>
      <div class="field" id="monthlyDayField" style="display:none">
        <label for="f-monthday">Día del mes</label>
        <select id="f-monthday"></select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn-primary" id="saveBtn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'seguimiento_actividades_v1';
  let activities = [];
  let editingId = null;
  let draggingId = null;
  let justMovedId = null;
  let currentView = 'board';
  let calState = new Date();
  const activeCategories = new Set();
  const reschedulingIds = new Set();

  const priorityGlyph = { alta:'◆', media:'●', baja:'–' };
  const priorityClass = { alta:'priority-alta', media:'priority-media', baja:'priority-baja' };
  const recurrenceLabel = { weekly:'Semanal', monthly:'Mensual' };
  const STATUS_ORDER = ['todo','progress','done'];

  const categoryPalette = [
    { dot:'#8388F0', bg:'rgba(131,136,240,0.14)', text:'#B3B7F7', border:'rgba(131,136,240,0.35)' },
    { dot:'#5FBFA8', bg:'rgba(95,191,168,0.14)',  text:'#8FDCC8', border:'rgba(95,191,168,0.35)' },
    { dot:'#E88AAE', bg:'rgba(232,138,174,0.14)', text:'#F0AFC8', border:'rgba(232,138,174,0.35)' },
    { dot:'#E7AC55', bg:'rgba(231,172,85,0.14)',  text:'#F0C178', border:'rgba(231,172,85,0.35)' },
    { dot:'#6CB5D6', bg:'rgba(108,181,214,0.14)', text:'#9FD3EF', border:'rgba(108,181,214,0.35)' },
    { dot:'#B28DE5', bg:'rgba(178,141,229,0.14)', text:'#CBB0F2', border:'rgba(178,141,229,0.35)' },
    { dot:'#A3C469', bg:'rgba(163,196,105,0.14)', text:'#C4DE9C', border:'rgba(163,196,105,0.35)' },
    { dot:'#E07C61', bg:'rgba(224,124,97,0.14)',  text:'#F0A488', border:'rgba(224,124,97,0.35)' }
  ];

  const overlay = document.getElementById('overlay');
  const form = document.getElementById('activityForm');
  const prioritySelect = document.getElementById('prioritySelect');
  const colorSelect = document.getElementById('colorSelect');
  const toastEl = document.getElementById('toast');
  const searchInput = document.getElementById('searchInput');
  const checklistInput = document.getElementById('f-checklist-input');
  const checklistDraftList = document.getElementById('checklistDraftList');
  const recurrenceSelect = document.getElementById('f-recurrence');
  const weeklyDaysField = document.getElementById('weeklyDaysField');
  const monthlyDayField = document.getElementById('monthlyDayField');
  const weekdaySelect = document.getElementById('weekdaySelect');
  const monthdaySelect = document.getElementById('f-monthday');
  let selectedColorIndex = 0;
  let checklistDraft = [];
  let selectedWeekdays = new Set();

  for(let i = 1; i <= 31; i++){
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = i;
    monthdaySelect.appendChild(opt);
  }

  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });

  function uid(){ return 'a_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function isoDate(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }

  function formatShort(dueStr){
    const d = new Date(dueStr + 'T00:00:00');
    return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
  }

  function categoryKey(name){ return name && name.trim() ? name.trim() : 'Sin categoría'; }

  function categoryColor(name){
    const key = categoryKey(name);
    let hash = 0;
    for(let i=0;i<key.length;i++){ hash = (hash * 31 + key.charCodeAt(i)) >>> 0; }
    return categoryPalette[hash % categoryPalette.length];
  }

  function categoryColorFor(a){
    if(a && Number.isInteger(a.colorIndex) && categoryPalette[a.colorIndex]) return categoryPalette[a.colorIndex];
    return categoryColor(a ? a.category : '');
  }

  function buildColorSwatches(){
    colorSelect.innerHTML = '';
    categoryPalette.forEach((color, i) => {
      const sw = document.createElement('div');
      sw.className = 'color-swatch';
      sw.style.background = color.dot;
      sw.dataset.index = i;
      sw.title = 'Color ' + (i + 1);
      sw.tabIndex = 0;
      sw.setAttribute('role', 'button');
      colorSelect.appendChild(sw);
    });
  }

  function setColorIndex(i){
    selectedColorIndex = i;
    [...colorSelect.children].forEach(el => el.classList.toggle('selected', parseInt(el.dataset.index, 10) === i));
  }

  function enableKeyboardActivation(container, itemSelector){
    container.addEventListener('keydown', (e) => {
      if(e.key !== 'Enter' && e.key !== ' ') return;
      const item = e.target.closest(itemSelector);
      if(!item) return;
      e.preventDefault();
      item.click();
    });
  }

  buildColorSwatches();
  colorSelect.addEventListener('click', (e) => {
    const sw = e.target.closest('.color-swatch');
    if(!sw) return;
    setColorIndex(parseInt(sw.dataset.index, 10));
  });
  enableKeyboardActivation(colorSelect, '.color-swatch');

  function cloneChecklist(checklist){
    return (checklist || []).map(it => ({ id:uid(), text:it.text, done:false }));
  }

  function renderChecklistDraft(){
    checklistDraftList.innerHTML = '';
    checklistDraft.forEach(item => {
      const row = document.createElement('div');
      row.className = 'checklist-draft-item';
      row.innerHTML = '<span></span><button type="button" title="Quitar">✕</button>';
      row.querySelector('span').textContent = item.text;
      row.querySelector('button').addEventListener('click', () => {
        checklistDraft = checklistDraft.filter(x => x.id !== item.id);
        renderChecklistDraft();
      });
      checklistDraftList.appendChild(row);
    });
  }

  function addChecklistDraftItem(){
    const text = checklistInput.value.trim();
    if(!text) return;
    checklistDraft.push({ id:uid(), text, done:false });
    checklistInput.value = '';
    renderChecklistDraft();
    checklistInput.focus();
  }

  document.getElementById('checklistAddBtn').addEventListener('click', addChecklistDraftItem);
  checklistInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); addChecklistDraftItem(); }
  });

  function setWeekdays(days){
    selectedWeekdays = new Set(days || []);
    [...weekdaySelect.children].forEach(el => el.classList.toggle('selected', selectedWeekdays.has(parseInt(el.dataset.value, 10))));
  }

  weekdaySelect.addEventListener('click', (e) => {
    const opt = e.target.closest('.weekday-option');
    if(!opt) return;
    const v = parseInt(opt.dataset.value, 10);
    if(selectedWeekdays.has(v)) selectedWeekdays.delete(v); else selectedWeekdays.add(v);
    opt.classList.toggle('selected');
  });
  enableKeyboardActivation(weekdaySelect, '.weekday-option');

  function toggleRecurrenceFields(){
    const val = recurrenceSelect.value;
    weeklyDaysField.style.display = val === 'weekly' ? 'block' : 'none';
    monthlyDayField.style.display = val === 'monthly' ? 'block' : 'none';
  }
  recurrenceSelect.addEventListener('change', toggleRecurrenceFields);

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  function loadActivities(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        activities = JSON.parse(raw);
      } else {
        activities = seedData();
        persist();
      }
    }catch(e){
      console.error('No se pudo leer el almacenamiento local', e);
      activities = seedData();
    }
    refresh();
  }

  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(activities));
    }catch(e){
      console.error('No se pudo guardar', e);
      showToast('No se pudo guardar localmente');
    }
  }

  /* ---------- Exportar / Importar ---------- */
  function exportActivities(){
    const blob = new Blob([JSON.stringify(activities, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = isoDate(new Date());
    a.href = url;
    a.download = 'actividades-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Copia de seguridad descargada');
  }

  function sanitizeImported(list){
    if(!Array.isArray(list)) return null;
    const seenIds = new Set();
    const clean = [];
    for(const raw of list){
      if(!raw || typeof raw !== 'object') continue;
      const title = typeof raw.title === 'string' ? raw.title.trim() : '';
      if(!title) continue;
      let id = typeof raw.id === 'string' && raw.id ? raw.id : uid();
      while(seenIds.has(id)) id = uid();
      seenIds.add(id);
      clean.push({
        id, title,
        desc: typeof raw.desc === 'string' ? raw.desc : '',
        category: typeof raw.category === 'string' ? raw.category : '',
        due: typeof raw.due === 'string' ? raw.due : '',
        priority: ['alta','media','baja'].includes(raw.priority) ? raw.priority : 'media',
        status: STATUS_ORDER.includes(raw.status) ? raw.status : 'todo',
        progress: Number.isFinite(raw.progress) ? raw.progress : 0,
        recurrence: ['weekly','monthly'].includes(raw.recurrence) ? raw.recurrence : 'none',
        recurrenceDays: Array.isArray(raw.recurrenceDays) ? raw.recurrenceDays : undefined,
        recurrenceDayOfMonth: Number.isFinite(raw.recurrenceDayOfMonth) ? raw.recurrenceDayOfMonth : undefined,
        colorIndex: Number.isInteger(raw.colorIndex) ? raw.colorIndex : undefined,
        checklist: Array.isArray(raw.checklist) ? raw.checklist.map(it => ({
          id: typeof it.id === 'string' && it.id ? it.id : uid(),
          text: typeof it.text === 'string' ? it.text : '',
          done: !!it.done
        })).filter(it => it.text) : undefined
      });
    }
    return clean;
  }

  function importActivities(file){
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(e){
        showToast('El archivo no es un JSON válido');
        return;
      }
      const clean = sanitizeImported(parsed);
      if(clean === null){
        showToast('El archivo no tiene el formato esperado');
        return;
      }
      if(clean.length === 0){
        showToast('No se encontraron actividades válidas en el archivo');
        return;
      }
      const ok = confirm('Se reemplazará el tablero actual con ' + clean.length + ' actividad(es) del archivo. ¿Continuar?');
      if(!ok) return;
      activities = clean;
      persist();
      refresh();
      showToast('Actividades importadas');
    };
    reader.onerror = () => showToast('No se pudo leer el archivo');
    reader.readAsText(file);
  }

  document.getElementById('exportBtn').addEventListener('click', exportActivities);
  const importFileInput = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => importFileInput.click());
  importFileInput.addEventListener('change', () => {
    const file = importFileInput.files[0];
    if(file) importActivities(file);
    importFileInput.value = '';
  });

  function seedData(){
    const today = new Date();
    const plus = (n) => { const d = new Date(today); d.setDate(d.getDate()+n); return isoDate(d); };
    return [
      { id:uid(), title:'Definir alcance del proyecto', desc:'', category:'Trabajo', due:plus(-1), priority:'alta', status:'todo', progress:0, recurrence:'none',
        checklist:[
          { id:uid(), text:'Reunirse con el cliente', done:false },
          { id:uid(), text:'Documentar requisitos', done:false }
        ] },
      { id:uid(), title:'Leer 30 páginas', desc:'', category:'Personal', due:plus(3), priority:'media', status:'todo', progress:0, recurrence:'none' },
      { id:uid(), title:'Preparar presentación', desc:'Revisar cifras del trimestre', category:'Trabajo', due:plus(1), priority:'alta', status:'progress', progress:50, recurrence:'none',
        checklist:[
          { id:uid(), text:'Reunir cifras del trimestre', done:true },
          { id:uid(), text:'Diseñar diapositivas', done:false },
          { id:uid(), text:'Ensayar la exposición', done:false }
        ] },
      { id:uid(), title:'Rutina de ejercicio', desc:'', category:'Salud', due:plus(0), priority:'baja', status:'progress', progress:75, recurrence:'weekly', recurrenceDays:[1,3,5] },
      { id:uid(), title:'Configurar entorno de desarrollo', desc:'', category:'Trabajo', due:plus(-5), priority:'media', status:'done', progress:100, recurrence:'none' }
    ];
  }

  function daysUntil(dueStr){
    if(!dueStr) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(dueStr + 'T00:00:00');
    return Math.round((due - today) / 86400000);
  }

  function urgencyOf(a){
    if(a.status === 'done') return 'done';
    const d = daysUntil(a.due);
    if(d === null) return 'none';
    if(d < 0) return 'overdue';
    if(d <= 2) return 'soon';
    return 'ok';
  }

  function urgencyLabel(u, d){
    if(u === 'done') return 'Completada';
    if(u === 'none') return 'Sin fecha';
    if(u === 'overdue') return 'Vencida';
    if(u === 'soon') return d === 0 ? 'Urgente · hoy' : 'Urgente';
    return 'A tiempo';
  }

  function matches(a){
    const q = searchInput.value.trim().toLowerCase();
    const textMatch = !q || a.title.toLowerCase().includes(q) || categoryKey(a.category).toLowerCase().includes(q) || (a.desc && a.desc.toLowerCase().includes(q));
    const catMatch = activeCategories.size === 0 || activeCategories.has(categoryKey(a.category));
    return textMatch && catMatch;
  }

  function sortByDue(list){
    return list.slice().sort((a,b) => {
      if(!a.due && !b.due) return 0;
      if(!a.due) return 1;
      if(!b.due) return -1;
      return a.due.localeCompare(b.due);
    });
  }

  function isoWeekday(d){ return ((d.getDay() + 6) % 7) + 1; }

  function nextWeeklyDate(base, days){
    const set = days && days.length ? days : [isoWeekday(base)];
    for(let add = 1; add <= 14; add++){
      const cand = new Date(base);
      cand.setDate(cand.getDate() + add);
      if(set.includes(isoWeekday(cand))) return cand;
    }
    const fallback = new Date(base);
    fallback.setDate(fallback.getDate() + 7);
    return fallback;
  }

  function nextMonthlyDate(base, dayOfMonth){
    const dom = dayOfMonth || base.getDate();
    const next = new Date(base.getFullYear(), base.getMonth() + 1, 1);
    const daysInNextMonth = new Date(next.getFullYear(), next.getMonth() + 1, 0).getDate();
    next.setDate(Math.min(dom, daysInNextMonth));
    return next;
  }

  const weekdayAbbrev = { 1:'L', 2:'M', 3:'X', 4:'J', 5:'V', 6:'S', 7:'D' };

  function recurrenceDetail(a){
    if(a.recurrence === 'weekly' && a.recurrenceDays && a.recurrenceDays.length){
      return [...a.recurrenceDays].sort((x,y) => x - y).map(d => weekdayAbbrev[d]).join('');
    }
    if(a.recurrence === 'monthly' && a.recurrenceDayOfMonth){
      return 'día ' + a.recurrenceDayOfMonth;
    }
    return '';
  }

  function spawnRecurrence(a){
    if(!a.recurrence || a.recurrence === 'none') return;
    const base = a.due ? new Date(a.due + 'T00:00:00') : new Date();
    let next;
    if(a.recurrence === 'weekly') next = nextWeeklyDate(base, a.recurrenceDays);
    else if(a.recurrence === 'monthly') next = nextMonthlyDate(base, a.recurrenceDayOfMonth);
    else next = new Date(base);
    const nextIso = isoDate(next);
    activities.push({
      id:uid(), title:a.title, desc:a.desc, category:a.category, colorIndex:a.colorIndex,
      due:nextIso, priority:a.priority, status:'todo', progress:0, recurrence:a.recurrence,
      recurrenceDays:a.recurrenceDays, recurrenceDayOfMonth:a.recurrenceDayOfMonth,
      checklist:cloneChecklist(a.checklist)
    });
    showToast('Completada. Próxima repetición: ' + formatShort(nextIso));
  }

  function refresh(){
    renderTagList();
    renderBoard();
    renderCalendar();
    refreshCategoryDatalist();
  }

  // Para acciones que no agregan/quitan categorías ni actividades (buscar, reagendar):
  // evita reconstruir la lista de etiquetas y el datalist de categorías, que no cambian.
  function refreshFiltered(){
    renderBoard();
    renderCalendar();
  }

  function renderTagList(){
    const tagList = document.getElementById('tagList');
    const counts = {};
    activities.forEach(a => { const k = categoryKey(a.category); counts[k] = (counts[k]||0) + 1; });
    const cats = Object.keys(counts).sort();

    tagList.innerHTML = '';

    const allChip = document.createElement('div');
    allChip.className = 'tag-chip tag-all' + (activeCategories.size === 0 ? ' active' : '');
    allChip.textContent = 'Todas';
    allChip.addEventListener('click', () => { activeCategories.clear(); refresh(); });
    tagList.appendChild(allChip);

    cats.forEach(cat => {
      const color = categoryColor(cat);
      const chip = document.createElement('div');
      chip.className = 'tag-chip' + (activeCategories.has(cat) ? ' active' : '');
      chip.innerHTML = '<span class="tag-dot" style="background:' + color.dot + '"></span><span></span><span class="tag-count">' + counts[cat] + '</span>';
      chip.querySelector('span:nth-child(2)').textContent = cat;
      chip.addEventListener('click', () => {
        if(activeCategories.has(cat)) activeCategories.delete(cat); else activeCategories.add(cat);
        refresh();
      });
      tagList.appendChild(chip);
    });
  }

  function refreshCategoryDatalist(){
    const dl = document.getElementById('categoryList');
    const cats = [...new Set(activities.map(a => categoryKey(a.category)))].sort();
    dl.innerHTML = '';
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      dl.appendChild(opt);
    });
  }

  function renderBoard(){
    // Una sola pasada sobre 'activities' para agrupar por estado y contar totales,
    // en vez de recorrer el arreglo con .filter() varias veces por columna.
    const buckets = { todo:[], progress:[], done:[] };
    const totalCounts = { todo:0, progress:0, done:0 };
    for(const a of activities){
      if(totalCounts[a.status] !== undefined) totalCounts[a.status]++;
      if(buckets[a.status] && matches(a)) buckets[a.status].push(a);
    }

    const hasFilter = !!(searchInput.value.trim() || activeCategories.size);
    const total = activities.length || 1;

    STATUS_ORDER.forEach(status => {
      const zone = document.getElementById('zone-' + status);
      const items = sortByDue(buckets[status]);
      zone.innerHTML = '';

      if(items.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = hasFilter ? 'Sin resultados.' : (status === 'done' ? 'Nada completado todavía.' : 'Arrastra actividades aquí.');
        zone.appendChild(empty);
      } else {
        const zoneFrag = document.createDocumentFragment();
        items.forEach(a => zoneFrag.appendChild(buildCard(a)));
        zone.appendChild(zoneFrag);
      }
      document.getElementById('count-' + status).textContent = totalCounts[status];
      document.getElementById('flow-' + status).style.width = Math.round((totalCounts[status] / total) * 100) + '%';
    });

    justMovedId = null;
  }

  function buildCard(a){
    const card = document.createElement('div');
    const urgency = urgencyOf(a);
    const d = daysUntil(a.due);
    card.className = 'card' + (a.status === 'done' ? ' done' : '') + ' urgency-' + urgency + (a.id === justMovedId ? ' card-moved' : '');
    card.draggable = true;
    card.dataset.id = a.id;

    const catColor = categoryColorFor(a);
    const catKey = categoryKey(a.category);
    const uLabel = urgencyLabel(urgency, d);
    const isRescheduling = reschedulingIds.has(a.id);

    let progressHtml = '';
    if(a.status === 'progress'){
      progressHtml = '<div class="progress-buttons">' + [0,25,50,75,100].map(v => '<button type="button" class="progress-btn' + (a.progress === v ? ' active' : '') + '" data-value="' + v + '">' + v + '</button>').join('') + '</div>';
    } else if(a.status === 'done'){
      progressHtml = '<div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>';
    }

    let dueRowHtml = '';
    let dueCornerHtml = '';
    if(isRescheduling){
      dueRowHtml = '<div class="reschedule-row">' +
        '<input type="date" class="reschedule-input" value="' + (a.due || '') + '">' +
        '<button type="button" class="btn-mini save" data-action="reschedule-save">Guardar</button>' +
        '<button type="button" class="btn-mini ghost" data-action="reschedule-cancel">Cancelar</button>' +
      '</div>';
    } else {
      const showReschedule = urgency === 'overdue';
      dueCornerHtml = '<div class="due-corner">' +
        '<span class="due-badge due-' + urgency + '"></span>' +
        (showReschedule ? '<button type="button" class="reschedule-btn" data-action="reschedule">Reagendar</button>' : '') +
      '</div>';
    }

    let checklistHtml = '';
    if(a.checklist && a.checklist.length){
      checklistHtml = '<div class="checklist">' +
        a.checklist.map(it => '<label class="checklist-item' + (it.done ? ' done' : '') + '" data-item-id="' + it.id + '">' +
          '<input type="checkbox"' + (it.done ? ' checked' : '') + '><span></span>' +
        '</label>').join('') +
      '</div>';
    }

    const statusIdx = STATUS_ORDER.indexOf(a.status);
    const moveControlsHtml =
      '<div class="move-controls">' +
        '<button type="button" class="move-btn" data-action="move-prev" title="Mover a la columna anterior"' + (statusIdx <= 0 ? ' disabled' : '') + '>‹</button>' +
        '<button type="button" class="move-btn" data-action="move-next" title="Mover a la columna siguiente"' + (statusIdx >= STATUS_ORDER.length - 1 ? ' disabled' : '') + '>›</button>' +
      '</div>';

    card.innerHTML =
      (urgency === 'overdue' ? '<span class="pulse-dot"></span>' : '') +
      '<div class="card-top">' +
        '<span class="priority-mark ' + priorityClass[a.priority] + '">' + priorityGlyph[a.priority] + '</span>' +
        '<span class="card-title"></span>' +
        dueCornerHtml +
        '<div class="card-actions">' +
          moveControlsHtml +
          (a.status === 'done' ? '<button class="icon-btn" data-action="reuse" title="Reutilizar actividad">↺</button>' : '') +
          '<button class="icon-btn" data-action="edit" title="Editar">✎</button>' +
          '<button class="icon-btn" data-action="delete" title="Eliminar">✕</button>' +
        '</div>' +
      '</div>' +
      dueRowHtml +
      (a.desc ? '<div class="card-desc"></div>' : '') +
      checklistHtml +
      '<div class="card-tags">' +
        '<span class="category-tag" style="background:' + catColor.bg + ';color:' + catColor.text + ';border-color:' + catColor.border + '"></span>' +
        '<span class="status-tag due-' + urgency + '">' + uLabel + '</span>' +
        (a.recurrence && a.recurrence !== 'none' ? '<span class="recurrence-tag">↻ ' + recurrenceLabel[a.recurrence] + (recurrenceDetail(a) ? ' · ' + recurrenceDetail(a) : '') + '</span>' : '') +
      '</div>' +
      progressHtml;

    card.querySelector('.card-title').textContent = a.title;
    if(a.desc) card.querySelector('.card-desc').textContent = a.desc;
    card.querySelector('.category-tag').textContent = catKey;
    if(!isRescheduling) card.querySelector('.due-badge').textContent = a.due ? formatShort(a.due) : 'Sin fecha';

    if(a.checklist && a.checklist.length){
      card.querySelectorAll('.checklist-item').forEach(row => {
        const itemId = row.dataset.itemId;
        const item = a.checklist.find(it => it.id === itemId);
        if(!item) return;
        row.querySelector('span').textContent = item.text;
        row.querySelector('input').addEventListener('change', (e) => {
          const act = activities.find(x => x.id === a.id);
          const actItem = act && act.checklist && act.checklist.find(it => it.id === itemId);
          if(actItem){ actItem.done = e.target.checked; }
          persist();
          // Marcar un ítem del checklist no cambia columna, urgencia ni categorías,
          // así que basta con actualizar esta fila en vez de reconstruir todo el tablero.
          row.classList.toggle('done', e.target.checked);
        });
      });
    }

    card.addEventListener('dragstart', () => { draggingId = a.id; card.classList.add('dragging'); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); draggingId = null; });

    card.querySelector('[data-action="edit"]').addEventListener('click', () => openEdit(a.id));
    card.querySelector('[data-action="delete"]').addEventListener('click', () => deleteActivity(a.id));
    const reuseBtn = card.querySelector('[data-action="reuse"]');
    if(reuseBtn) reuseBtn.addEventListener('click', () => reuseActivity(a.id));

    // Botones ‹ › : alternativa al drag & drop para moverse entre columnas,
    // imprescindible en dispositivos táctiles donde el drag & drop HTML5 no es confiable.
    const movePrevBtn = card.querySelector('[data-action="move-prev"]');
    const moveNextBtn = card.querySelector('[data-action="move-next"]');
    if(movePrevBtn) movePrevBtn.addEventListener('click', () => {
      const idx = STATUS_ORDER.indexOf(a.status);
      if(idx > 0) moveActivityToStatus(a.id, STATUS_ORDER[idx - 1]);
    });
    if(moveNextBtn) moveNextBtn.addEventListener('click', () => {
      const idx = STATUS_ORDER.indexOf(a.status);
      if(idx < STATUS_ORDER.length - 1) moveActivityToStatus(a.id, STATUS_ORDER[idx + 1]);
    });

    const progressBtns = card.querySelectorAll('.progress-btn');
    progressBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.dataset.value, 10);
        const act = activities.find(x => x.id === a.id);
        act.progress = val;
        if(val === 100 && act.status !== 'done'){
          act.status = 'done';
          justMovedId = act.id;
          spawnRecurrence(act);
          persist();
          refresh(); // cambia de columna, sí necesita reconstruir el tablero
        } else {
          persist();
          // Progreso dentro de la misma columna: solo actualizar los botones de esta tarjeta.
          progressBtns.forEach(b => b.classList.toggle('active', parseInt(b.dataset.value, 10) === val));
        }
      });
    });

    const rescheduleBtn = card.querySelector('[data-action="reschedule"]');
    if(rescheduleBtn){
      rescheduleBtn.addEventListener('click', () => { reschedulingIds.add(a.id); refresh(); });
    }
    const rescheduleSave = card.querySelector('[data-action="reschedule-save"]');
    if(rescheduleSave){
      rescheduleSave.addEventListener('click', () => {
        const input = card.querySelector('.reschedule-input');
        const act = activities.find(x => x.id === a.id);
        act.due = input.value;
        reschedulingIds.delete(a.id);
        persist();
        refreshFiltered();
        showToast('Actividad reagendada');
      });
    }
    const rescheduleCancel = card.querySelector('[data-action="reschedule-cancel"]');
    if(rescheduleCancel){
      rescheduleCancel.addEventListener('click', () => { reschedulingIds.delete(a.id); refresh(); });
    }

    return card;
  }

  function moveActivityToStatus(id, status){
    const act = activities.find(a => a.id === id);
    if(!act) return;
    const prevStatus = act.status;
    const wasDone = act.status === 'done';
    act.status = status;
    if(status === 'done'){ act.progress = 100; if(!wasDone) spawnRecurrence(act); }
    if(status === 'todo') act.progress = 0;
    if(status !== prevStatus) justMovedId = act.id;
    persist();
    refresh();
  }

  STATUS_ORDER.forEach(status => {
    const zone = document.getElementById('zone-' + status);
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      if(!draggingId) return;
      moveActivityToStatus(draggingId, status);
    });
  });

  document.getElementById('clearDoneBtn').addEventListener('click', () => {
    const doneCount = activities.filter(a => a.status === 'done').length;
    if(doneCount === 0) return;
    if(confirm('¿Eliminar las ' + doneCount + ' actividades completadas?')){
      activities = activities.filter(a => a.status !== 'done');
      persist();
      refresh();
      showToast('Columna de completados vaciada');
    }
  });

  function deleteActivity(id){
    activities = activities.filter(a => a.id !== id);
    reschedulingIds.delete(id);
    persist();
    refresh();
    showToast('Actividad eliminada');
  }

  function reuseActivity(id){
    const a = activities.find(x => x.id === id);
    if(!a) return;
    activities.push({
      id:uid(), title:a.title, desc:a.desc, category:a.category, colorIndex:a.colorIndex,
      due:'', priority:a.priority, status:'todo', progress:0, recurrence:a.recurrence,
      recurrenceDays:a.recurrenceDays, recurrenceDayOfMonth:a.recurrenceDayOfMonth,
      checklist:cloneChecklist(a.checklist)
    });
    persist();
    refresh();
    showToast('Actividad reutilizada en Pendiente');
  }

  function openEdit(id){
    const a = activities.find(x => x.id === id);
    if(!a) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Editar actividad';
    document.getElementById('f-title').value = a.title;
    document.getElementById('f-desc').value = a.desc || '';
    document.getElementById('f-category').value = a.category || '';
    document.getElementById('f-due').value = a.due || '';
    document.getElementById('f-recurrence').value = a.recurrence || 'none';
    setPriority(a.priority);
    setColorIndex(Number.isInteger(a.colorIndex) ? a.colorIndex : categoryPalette.indexOf(categoryColor(a.category)));
    checklistDraft = (a.checklist || []).map(it => ({ ...it }));
    renderChecklistDraft();
    setWeekdays(a.recurrenceDays || []);
    monthdaySelect.value = a.recurrenceDayOfMonth || new Date().getDate();
    toggleRecurrenceFields();
    overlay.classList.add('open');
    document.getElementById('f-title').focus();
  }

  function openNew(){
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Nueva actividad';
    form.reset();
    setPriority('media');
    setColorIndex(0);
    checklistDraft = [];
    renderChecklistDraft();
    document.getElementById('f-recurrence').value = 'none';
    setWeekdays([]);
    monthdaySelect.value = new Date().getDate();
    toggleRecurrenceFields();
    overlay.classList.add('open');
    document.getElementById('f-title').focus();
  }

  function closeModal(){ overlay.classList.remove('open'); editingId = null; }

  function setPriority(value){
    [...prioritySelect.children].forEach(el => el.classList.toggle('selected', el.dataset.value === value));
  }

  prioritySelect.addEventListener('click', (e) => {
    const opt = e.target.closest('.priority-option');
    if(!opt) return;
    setPriority(opt.dataset.value);
  });
  enableKeyboardActivation(prioritySelect, '.priority-option');

  document.getElementById('openModalBtn').addEventListener('click', openNew);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('f-title').value.trim();
    if(!title) return;
    const priority = prioritySelect.querySelector('.selected').dataset.value;
    const recurrence = document.getElementById('f-recurrence').value;
    const recurrenceDays = recurrence === 'weekly' ? [...selectedWeekdays].sort((x,y) => x - y) : undefined;
    const recurrenceDayOfMonth = recurrence === 'monthly' ? parseInt(monthdaySelect.value, 10) : undefined;
    const checklist = checklistDraft.map(it => ({ ...it }));

    if(editingId){
      const a = activities.find(x => x.id === editingId);
      a.title = title;
      a.desc = document.getElementById('f-desc').value.trim();
      a.category = document.getElementById('f-category').value.trim();
      a.due = document.getElementById('f-due').value;
      a.priority = priority;
      a.recurrence = recurrence;
      a.recurrenceDays = recurrenceDays;
      a.recurrenceDayOfMonth = recurrenceDayOfMonth;
      a.colorIndex = selectedColorIndex;
      a.checklist = checklist;
      showToast('Actividad actualizada');
    } else {
      activities.push({
        id:uid(), title,
        desc:document.getElementById('f-desc').value.trim(),
        category:document.getElementById('f-category').value.trim(),
        due:document.getElementById('f-due').value,
        priority, status:'todo', progress:0, recurrence, recurrenceDays, recurrenceDayOfMonth,
        colorIndex:selectedColorIndex, checklist
      });
      showToast('Actividad creada');
    }
    persist();
    closeModal();
    refresh();
  });

  let searchDebounceTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    // Evita reconstruir el tablero en cada tecla; espera a que la persona
    // haga una pausa breve al escribir.
    searchDebounceTimer = setTimeout(refreshFiltered, 150);
  });

  /* ---------- View toggle ---------- */
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.dataset.view;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.getElementById('boardView').style.display = currentView === 'board' ? 'grid' : 'none';
      document.getElementById('calendarView').style.display = currentView === 'calendar' ? 'flex' : 'none';
      if(currentView === 'calendar') renderCalendar();
    });
  });

  /* ---------- Calendar ---------- */
  function renderCalendar(){
    if(currentView !== 'calendar') return;
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const year = calState.getFullYear();
    const month = calState.getMonth();
    document.getElementById('calLabel').textContent = calState.toLocaleDateString('es-ES', { month:'long', year:'numeric' });

    const firstDay = new Date(year, month, 1);
    const startOffset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    const todayStr = isoDate(new Date());

    for(let i = 0; i < totalCells; i++){
      const dayNum = i - startOffset + 1;
      let cellDate, otherMonth = false;
      if(dayNum < 1){ cellDate = new Date(year, month - 1, daysInPrevMonth + dayNum); otherMonth = true; }
      else if(dayNum > daysInMonth){ cellDate = new Date(year, month + 1, dayNum - daysInMonth); otherMonth = true; }
      else { cellDate = new Date(year, month, dayNum); }

      const iso = isoDate(cellDate);
      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (otherMonth ? ' other-month' : '') + (iso === todayStr ? ' is-today' : '');

      const dayNumEl = document.createElement('div');
      dayNumEl.className = 'cal-daynum';
      dayNumEl.textContent = cellDate.getDate();
      cell.appendChild(dayNumEl);

      const dayEvents = sortByDue(activities.filter(a => a.due === iso && matches(a)));
      const shown = dayEvents.slice(0, 3);
      shown.forEach(a => {
        const u = urgencyOf(a);
        const color = categoryColorFor(a);
        const ev = document.createElement('div');
        ev.className = 'cal-event' + (u === 'overdue' ? ' is-overdue' : u === 'soon' ? ' is-soon' : u === 'done' ? ' is-done' : '');
        ev.innerHTML = '<span class="cal-event-dot" style="background:' + color.dot + '"></span><span></span>';
        ev.querySelector('span:nth-child(2)').textContent = a.title;
        ev.title = a.title;
        ev.addEventListener('click', () => openEdit(a.id));
        cell.appendChild(ev);
      });
      if(dayEvents.length > 3){
        const more = document.createElement('div');
        more.className = 'cal-more';
        more.textContent = '+' + (dayEvents.length - 3) + ' más';
        cell.appendChild(more);
      }

      grid.appendChild(cell);
    }
  }

  document.getElementById('calPrev').addEventListener('click', () => { calState.setMonth(calState.getMonth() - 1); renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', () => { calState.setMonth(calState.getMonth() + 1); renderCalendar(); });
  document.getElementById('calToday').addEventListener('click', () => { calState = new Date(); renderCalendar(); });

  loadActivities();
})();
</script>
